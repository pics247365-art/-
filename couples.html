<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אילן ואשתו — פרטי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:    #0a0a0a;
    --cream: #e8e0d0;
    --gold:  #c49a2a;
    --red:   #a81818;
    --warm:  #c8a97a;
    --surface: #141414;
    --border: #2a2a2a;
  }

  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'Assistant', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ─── PIN SCREEN ─── */
  #pin-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    z-index: 100;
  }

  #pin-screen h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 2.2rem;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.05em;
  }

  #pin-screen p {
    color: var(--warm);
    font-size: 0.95rem;
    opacity: 0.7;
  }

  #pin-dots {
    display: flex;
    gap: 1rem;
  }

  .pin-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background: transparent;
    transition: background 0.2s;
  }
  .pin-dot.filled { background: var(--gold); }

  #pin-pad {
    display: grid;
    grid-template-columns: repeat(3, 70px);
    gap: 12px;
  }

  .pin-btn {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--cream);
    font-family: 'Assistant', sans-serif;
    font-size: 1.4rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .pin-btn:hover { border-color: var(--gold); color: var(--gold); }
  .pin-btn:active { transform: scale(0.93); }
  .pin-btn.del { font-size: 1rem; color: var(--warm); }

  #pin-error {
    color: var(--red);
    font-size: 0.9rem;
    min-height: 1.2em;
  }

  /* ─── MAIN APP ─── */
  #app {
    width: 100%;
    max-width: 480px;
    padding: 0 1rem 6rem;
    display: none;
  }

  header {
    text-align: center;
    padding: 2.5rem 0 1.5rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  header h1 {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 2rem;
    font-weight: 900;
    color: var(--gold);
  }

  header p {
    color: var(--warm);
    font-size: 0.9rem;
    margin-top: 0.3rem;
  }

  /* ─── STATS STRIP ─── */
  .stats-strip {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 2rem;
  }

  .stat-box {
    background: var(--surface);
    padding: 1.2rem 0.5rem;
    text-align: center;
  }

  .stat-num {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 2rem;
    font-weight: 900;
    color: var(--gold);
    line-height: 1;
  }

  .stat-label {
    font-size: 0.75rem;
    color: var(--warm);
    margin-top: 0.3rem;
    opacity: 0.8;
  }

  /* ─── LOG BUTTON ─── */
  #log-btn {
    width: 100%;
    padding: 1.1rem;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 1.3rem;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 2rem;
    letter-spacing: 0.03em;
  }
  #log-btn:hover { background: var(--warm); transform: translateY(-1px); }
  #log-btn:active { transform: scale(0.98); }

  /* ─── LOG MODAL ─── */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 1rem;
  }
  .modal-bg.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 380px;
  }

  .modal h2 {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 1.5rem;
  }

  .form-group {
    margin-bottom: 1.2rem;
  }

  .form-group label {
    display: block;
    font-size: 0.85rem;
    color: var(--warm);
    margin-bottom: 0.4rem;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 0.7rem 0.9rem;
    border-radius: 8px;
    font-family: 'Assistant', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus { border-color: var(--gold); }

  .form-group textarea { resize: vertical; min-height: 80px; }

  .mood-grid {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .mood-btn {
    padding: 0.4rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--cream);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .mood-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(196,154,42,0.1); }

  .modal-actions {
    display: flex;
    gap: 0.8rem;
    margin-top: 1.5rem;
  }

  .btn-save {
    flex: 1;
    padding: 0.8rem;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-cancel {
    padding: 0.8rem 1.2rem;
    background: transparent;
    color: var(--warm);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    cursor: pointer;
  }

  /* ─── CALENDAR ─── */
  .section-title {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--cream);
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .section-title span { color: var(--warm); font-size: 0.85rem; font-family: 'Assistant', sans-serif; font-weight: 400; }

  .cal-nav { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.8rem; }
  .cal-nav button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--warm);
    width: 32px; height: 32px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 1rem;
  }
  .cal-month {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--cream);
    flex: 1;
    text-align: center;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 2rem;
  }

  .cal-day-name {
    text-align: center;
    font-size: 0.7rem;
    color: var(--warm);
    opacity: 0.6;
    padding: 4px 0;
  }

  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: 0.85rem;
    color: var(--cream);
    cursor: default;
    opacity: 0.4;
    position: relative;
  }

  .cal-day.has-event {
    background: rgba(196,154,42,0.15);
    border: 1px solid rgba(196,154,42,0.4);
    opacity: 1;
    color: var(--gold);
    font-weight: 600;
    cursor: pointer;
  }

  .cal-day.today {
    border: 1px solid var(--warm);
    opacity: 0.8;
  }

  .cal-day.today.has-event { border-color: var(--gold); opacity: 1; }

  .cal-day.empty { pointer-events: none; }

  /* ─── HISTORY LIST ─── */
  .entry-list { display: flex; flex-direction: column; gap: 0.8rem; margin-bottom: 2rem; }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .entry-date {
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 0.95rem;
    color: var(--gold);
    font-weight: 700;
  }

  .entry-meta {
    font-size: 0.8rem;
    color: var(--warm);
    margin-top: 0.2rem;
    opacity: 0.8;
  }

  .entry-note {
    font-size: 0.85rem;
    color: var(--cream);
    margin-top: 0.4rem;
    opacity: 0.7;
  }

  .entry-delete {
    background: transparent;
    border: none;
    color: var(--border);
    font-size: 1.1rem;
    cursor: pointer;
    transition: color 0.2s;
    padding: 0 0.2rem;
  }
  .entry-delete:hover { color: var(--red); }

  /* ─── BOTTOM NAV ─── */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 3.5rem;
    background: rgba(10,10,10,0.95);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  #lock-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--warm);
    border-radius: 8px;
    padding: 0.5rem 1.2rem;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: 'Assistant', sans-serif;
    opacity: 0.7;
  }
  #lock-btn:hover { opacity: 1; border-color: var(--warm); }

  #change-pin-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--warm);
    border-radius: 8px;
    padding: 0.5rem 1.2rem;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: 'Assistant', sans-serif;
    opacity: 0.5;
  }
  #change-pin-btn:hover { opacity: 0.9; }

  /* empty state */
  .empty-state {
    text-align: center;
    padding: 2rem;
    color: var(--warm);
    opacity: 0.5;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen">
  <div>
    <h1>🔐 פרטי</h1>
    <p style="text-align:center; margin-top:0.3rem">הכנס קוד גישה</p>
  </div>
  <div id="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div id="pin-pad">
    <button class="pin-btn" data-n="1">1</button>
    <button class="pin-btn" data-n="2">2</button>
    <button class="pin-btn" data-n="3">3</button>
    <button class="pin-btn" data-n="4">4</button>
    <button class="pin-btn" data-n="5">5</button>
    <button class="pin-btn" data-n="6">6</button>
    <button class="pin-btn" data-n="7">7</button>
    <button class="pin-btn" data-n="8">8</button>
    <button class="pin-btn" data-n="9">9</button>
    <button class="pin-btn del" data-n="del">⌫</button>
    <button class="pin-btn" data-n="0">0</button>
    <button class="pin-btn del" data-n="ok">OK</button>
  </div>
  <div id="pin-error"></div>
</div>

<!-- MAIN APP -->
<div id="app">
  <header>
    <h1>אילן ❤ </h1>
    <p id="last-time-text">טוען...</p>
  </header>

  <!-- STATS -->
  <div class="stats-strip">
    <div class="stat-box">
      <div class="stat-num" id="stat-week">0</div>
      <div class="stat-label">השבוע</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-month">0</div>
      <div class="stat-label">החודש</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">סה"כ</div>
    </div>
  </div>

  <!-- LOG BUTTON -->
  <button id="log-btn">+ רשום עכשיו</button>

  <!-- CALENDAR -->
  <div class="cal-nav">
    <button id="cal-prev">‹</button>
    <div class="cal-month" id="cal-month-label"></div>
    <button id="cal-next">›</button>
  </div>
  <div class="cal-grid" id="cal-grid"></div>

  <!-- HISTORY -->
  <div class="section-title">
    היסטוריה
    <span id="history-count"></span>
  </div>
  <div class="entry-list" id="entry-list">
    <div class="empty-state">עדיין אין רשומות</div>
  </div>

  <div class="bottom-bar">
    <button id="change-pin-btn">שנה PIN</button>
    <button id="lock-btn">🔒 נעל</button>
  </div>
</div>

<!-- LOG MODAL -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2>רשום</h2>
    <div class="form-group">
      <label>תאריך ושעה</label>
      <input type="datetime-local" id="entry-datetime">
    </div>
    <div class="form-group">
      <label>מצב רוח</label>
      <div class="mood-grid">
        <button class="mood-btn" data-mood="🔥 לוהט">🔥 לוהט</button>
        <button class="mood-btn" data-mood="❤️ רומנטי">❤️ רומנטי</button>
        <button class="mood-btn" data-mood="😌 רגוע">😌 רגוע</button>
        <button class="mood-btn" data-mood="🎉 מיוחד">🎉 מיוחד</button>
        <button class="mood-btn" data-mood="💤 לפני שינה">💤 לפני שינה</button>
        <button class="mood-btn" data-mood="⚡ ספונטני">⚡ ספונטני</button>
      </div>
    </div>
    <div class="form-group">
      <label>הערה (אופציונלי)</label>
      <textarea id="entry-note" placeholder="..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-save" id="save-btn">שמור</button>
      <button class="btn-cancel" id="cancel-btn">ביטול</button>
    </div>
  </div>
</div>

<!-- CHANGE PIN MODAL -->
<div class="modal-bg" id="change-pin-modal">
  <div class="modal">
    <h2>שנה PIN</h2>
    <div class="form-group">
      <label>PIN נוכחי</label>
      <input type="password" inputmode="numeric" maxlength="4" id="old-pin" placeholder="••••">
    </div>
    <div class="form-group">
      <label>PIN חדש (4 ספרות)</label>
      <input type="password" inputmode="numeric" maxlength="4" id="new-pin" placeholder="••••">
    </div>
    <div class="form-group">
      <label>אשר PIN חדש</label>
      <input type="password" inputmode="numeric" maxlength="4" id="new-pin2" placeholder="••••">
    </div>
    <p id="pin-change-error" style="color:var(--red); font-size:0.85rem; min-height:1.2em;"></p>
    <div class="modal-actions">
      <button class="btn-save" id="save-pin-btn">שמור</button>
      <button class="btn-cancel" id="cancel-pin-btn">ביטול</button>
    </div>
  </div>
</div>

<script>
// ─── STORAGE KEYS ───
const KEY_PIN     = 'cp_pin';
const KEY_ENTRIES = 'cp_entries';
const DEFAULT_PIN = '1234';

// ─── STATE ───
let pinInput = '';
let selectedMood = '';
let calYear, calMonth;

function getPin()     { return localStorage.getItem(KEY_PIN) || DEFAULT_PIN; }
function getEntries() { return JSON.parse(localStorage.getItem(KEY_ENTRIES) || '[]'); }
function saveEntries(e){ localStorage.setItem(KEY_ENTRIES, JSON.stringify(e)); }

// ─── PIN SCREEN ───
document.querySelectorAll('.pin-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const n = btn.dataset.n;
    if (n === 'del') {
      pinInput = pinInput.slice(0,-1);
    } else if (n === 'ok') {
      checkPin();
    } else {
      if (pinInput.length < 4) {
        pinInput += n;
        if (pinInput.length === 4) checkPin();
      }
    }
    updateDots();
  });
});

function updateDots() {
  for(let i=0;i<4;i++){
    document.getElementById('d'+i).classList.toggle('filled', i < pinInput.length);
  }
}

function checkPin() {
  if (pinInput === getPin()) {
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  } else {
    document.getElementById('pin-error').textContent = 'קוד שגוי';
    pinInput = '';
    updateDots();
    setTimeout(() => document.getElementById('pin-error').textContent = '', 1500);
  }
}

// ─── APP INIT ───
function initApp() {
  const now = new Date();
  calYear  = now.getFullYear();
  calMonth = now.getMonth();
  renderStats();
  renderCalendar();
  renderHistory();
}

// ─── STATS ───
function renderStats() {
  const entries = getEntries();
  const now = new Date();

  const weekAgo = new Date(now); weekAgo.setDate(now.getDate()-7);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

  const week  = entries.filter(e => new Date(e.dt) >= weekAgo).length;
  const month = entries.filter(e => new Date(e.dt) >= monthStart).length;
  const total = entries.length;

  document.getElementById('stat-week').textContent  = week;
  document.getElementById('stat-month').textContent = month;
  document.getElementById('stat-total').textContent = total;

  if (entries.length === 0) {
    document.getElementById('last-time-text').textContent = 'עדיין לא רשמתם';
  } else {
    const last = new Date(entries[0].dt);
    const diff = Math.floor((now - last) / 86400000);
    if (diff === 0) document.getElementById('last-time-text').textContent = 'היום! 🔥';
    else if (diff === 1) document.getElementById('last-time-text').textContent = 'אתמול';
    else document.getElementById('last-time-text').textContent = `לפני ${diff} ימים`;
  }
}

// ─── CALENDAR ───
const HE_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HE_DAYS   = ['א','ב','ג','ד','ה','ו','ש'];

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = `${HE_MONTHS[calMonth]} ${calYear}`;

  const entries = getEntries();
  const daysWithEvents = new Set(
    entries
      .filter(e => { const d=new Date(e.dt); return d.getFullYear()===calYear && d.getMonth()===calMonth; })
      .map(e => new Date(e.dt).getDate())
  );

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  HE_DAYS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-day-name';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstDay = new Date(calYear, calMonth, 1).getDay(); // 0=Sun
  for(let i=0;i<firstDay;i++){
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const today = new Date();

  for(let d=1;d<=daysInMonth;d++){
    const el = document.createElement('div');
    el.className = 'cal-day';
    el.textContent = d;

    const isToday = today.getDate()===d && today.getMonth()===calMonth && today.getFullYear()===calYear;
    if (isToday) el.classList.add('today');
    if (daysWithEvents.has(d)) el.classList.add('has-event');

    grid.appendChild(el);
  }
}

document.getElementById('cal-prev').addEventListener('click', () => {
  calMonth--;
  if(calMonth<0){ calMonth=11; calYear--; }
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click', () => {
  calMonth++;
  if(calMonth>11){ calMonth=0; calYear++; }
  renderCalendar();
});

// ─── HISTORY ───
function renderHistory() {
  const entries = getEntries();
  const list = document.getElementById('entry-list');
  document.getElementById('history-count').textContent = entries.length ? `${entries.length} רשומות` : '';

  if (entries.length === 0) {
    list.innerHTML = '<div class="empty-state">עדיין אין רשומות</div>';
    return;
  }

  list.innerHTML = entries.map((e,i) => {
    const d = new Date(e.dt);
    const dateStr = d.toLocaleDateString('he-IL', {day:'numeric', month:'long', year:'numeric'});
    const timeStr = d.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
    return `
      <div class="entry-card">
        <div>
          <div class="entry-date">${dateStr}</div>
          <div class="entry-meta">${timeStr}${e.mood ? ' · '+e.mood : ''}</div>
          ${e.note ? `<div class="entry-note">${e.note}</div>` : ''}
        </div>
        <button class="entry-delete" data-i="${i}">✕</button>
      </div>`;
  }).join('');

  list.querySelectorAll('.entry-delete').forEach(btn => {
    btn.addEventListener('click', () => {
      if(!confirm('למחוק רשומה זו?')) return;
      const entries = getEntries();
      entries.splice(+btn.dataset.i, 1);
      saveEntries(entries);
      renderStats(); renderCalendar(); renderHistory();
    });
  });
}

// ─── LOG MODAL ───
document.getElementById('log-btn').addEventListener('click', () => {
  const now = new Date();
  const local = new Date(now - now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  document.getElementById('entry-datetime').value = local;
  selectedMood = '';
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('entry-note').value = '';
  document.getElementById('modal').classList.add('open');
});

document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedMood = btn.dataset.mood;
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

document.getElementById('cancel-btn').addEventListener('click', () => {
  document.getElementById('modal').classList.remove('open');
});

document.getElementById('save-btn').addEventListener('click', () => {
  const dt = document.getElementById('entry-datetime').value;
  if (!dt) { alert('בחר תאריך ושעה'); return; }

  const entry = {
    dt: new Date(dt).toISOString(),
    mood: selectedMood,
    note: document.getElementById('entry-note').value.trim()
  };

  const entries = getEntries();
  entries.unshift(entry);
  entries.sort((a,b) => new Date(b.dt)-new Date(a.dt));
  saveEntries(entries);

  document.getElementById('modal').classList.remove('open');
  renderStats(); renderCalendar(); renderHistory();
});

// ─── CHANGE PIN ───
document.getElementById('change-pin-btn').addEventListener('click', () => {
  document.getElementById('old-pin').value='';
  document.getElementById('new-pin').value='';
  document.getElementById('new-pin2').value='';
  document.getElementById('pin-change-error').textContent='';
  document.getElementById('change-pin-modal').classList.add('open');
});

document.getElementById('cancel-pin-btn').addEventListener('click', () => {
  document.getElementById('change-pin-modal').classList.remove('open');
});

document.getElementById('save-pin-btn').addEventListener('click', () => {
  const old = document.getElementById('old-pin').value;
  const n1  = document.getElementById('new-pin').value;
  const n2  = document.getElementById('new-pin2').value;
  const err = document.getElementById('pin-change-error');

  if (old !== getPin()) { err.textContent='PIN נוכחי שגוי'; return; }
  if (!/^\d{4}$/.test(n1)) { err.textContent='PIN חייב להיות 4 ספרות'; return; }
  if (n1 !== n2) { err.textContent='הקודים לא תואמים'; return; }

  localStorage.setItem(KEY_PIN, n1);
  document.getElementById('change-pin-modal').classList.remove('open');
  alert('PIN שונה בהצלחה ✓');
});

// ─── LOCK ───
document.getElementById('lock-btn').addEventListener('click', () => {
  document.getElementById('app').style.display = 'none';
  document.getElementById('pin-screen').style.display = 'flex';
  pinInput = '';
  updateDots();
  document.getElementById('pin-error').textContent='';
});

// close modal on background click
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target===this) this.classList.remove('open');
});
document.getElementById('change-pin-modal').addEventListener('click', function(e){
  if(e.target===this) this.classList.remove('open');
});
</script>
</body>
</html>
