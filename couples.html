<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>אילן ואשתו — פרטי</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700;900&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0a0a0a;
  --cream:   #e8e0d0;
  --gold:    #c49a2a;
  --red:     #a81818;
  --warm:    #c8a97a;
  --surf:    #141414;
  --surf2:   #1c1c1c;
  --bdr:     #2a2a2a;
}
body {
  background: var(--bg);
  color: var(--cream);
  font-family: 'Assistant', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── PIN ── */
#pin-screen {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1.8rem; z-index: 200;
}
#pin-screen h1 { font-family: 'Frank Ruhl Libre', serif; font-size: 2rem; font-weight: 900; color: var(--gold); }
#pin-dots { display: flex; gap: 1rem; }
.pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--gold); }
.pin-dot.f { background: var(--gold); }
#pin-pad { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; }
.pb {
  width: 70px; height: 70px; border-radius: 50%;
  border: 1px solid var(--bdr); background: var(--surf);
  color: var(--cream); font-family: 'Assistant', sans-serif;
  font-size: 1.4rem; font-weight: 600; cursor: pointer; transition: all .15s;
}
.pb:hover { border-color: var(--gold); color: var(--gold); }
.pb:active { transform: scale(.92); }
.pb.sm { font-size: .9rem; color: var(--warm); }
#pin-err { color: var(--red); font-size: .9rem; min-height: 1.2em; }

/* ── APP SHELL ── */
#app { display: none; width: 100%; max-width: 480px; margin: 0 auto; }

/* ── TABS ── */
.tab-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: rgba(10,10,10,.97);
  border-top: 1px solid var(--bdr);
  display: flex; z-index: 50;
}
.tab-btn {
  flex: 1; padding: .7rem .2rem .5rem;
  background: transparent; border: none;
  color: var(--warm); font-size: .7rem;
  cursor: pointer; opacity: .5;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: opacity .2s, color .2s;
}
.tab-btn .ico { font-size: 1.35rem; line-height: 1; }
.tab-btn.active { opacity: 1; color: var(--gold); }

.page { display: none; padding: 1rem 1rem 5rem; }
.page.active { display: block; }

/* ── SHARED ── */
.section-title {
  font-family: 'Frank Ruhl Libre', serif; font-size: 1.1rem; font-weight: 700;
  color: var(--cream); margin-bottom: 1rem;
  display: flex; align-items: center; justify-content: space-between;
}
.section-title small { font-family: 'Assistant', sans-serif; font-size: .8rem; color: var(--warm); font-weight: 400; }

/* ── PAGE: DASHBOARD ── */
header { text-align: center; padding: 2.2rem 0 1.5rem; border-bottom: 1px solid var(--bdr); margin-bottom: 1.5rem; }
header h1 { font-family: 'Frank Ruhl Libre', serif; font-size: 2rem; font-weight: 900; color: var(--gold); }
header p { color: var(--warm); font-size: .9rem; margin-top: .25rem; }
.stats-strip {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 1px;
  background: var(--bdr); border: 1px solid var(--bdr); border-radius: 12px;
  overflow: hidden; margin-bottom: 1.5rem;
}
.stat-box { background: var(--surf); padding: 1rem .5rem; text-align: center; }
.stat-num { font-family: 'Frank Ruhl Libre', serif; font-size: 2rem; font-weight: 900; color: var(--gold); line-height: 1; }
.stat-lbl { font-size: .72rem; color: var(--warm); margin-top: .25rem; }
#log-btn {
  width: 100%; padding: 1rem;
  background: var(--gold); color: var(--bg); border: none;
  border-radius: 12px; font-family: 'Frank Ruhl Libre', serif;
  font-size: 1.2rem; font-weight: 900; cursor: pointer;
  margin-bottom: 1.5rem; transition: all .2s;
}
#log-btn:hover { background: var(--warm); }
/* calendar */
.cal-nav { display: flex; align-items: center; gap: .8rem; margin-bottom: .8rem; }
.cal-nav button {
  background: transparent; border: 1px solid var(--bdr); color: var(--warm);
  width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 1rem;
}
.cal-month { flex: 1; text-align: center; font-family: 'Frank Ruhl Libre', serif; font-size: .95rem; font-weight: 700; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; margin-bottom: 1.5rem; }
.cdn { text-align: center; font-size: .68rem; color: var(--warm); opacity: .6; padding: 4px 0; }
.cd {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 5px; font-size: .8rem; color: var(--cream); opacity: .35;
}
.cd.ev { background: rgba(196,154,42,.14); border: 1px solid rgba(196,154,42,.4); opacity: 1; color: var(--gold); font-weight: 600; cursor: pointer; }
.cd.tod { border: 1px solid var(--warm); opacity: .8; }
.cd.tod.ev { border-color: var(--gold); opacity: 1; }
/* history */
.entry-list { display: flex; flex-direction: column; gap: .7rem; }
.ecard {
  background: var(--surf); border: 1px solid var(--bdr); border-radius: 10px;
  padding: .9rem 1rem; display: flex; justify-content: space-between; align-items: flex-start;
}
.edate { font-family: 'Frank Ruhl Libre', serif; font-size: .9rem; color: var(--gold); font-weight: 700; }
.emeta { font-size: .78rem; color: var(--warm); margin-top: .15rem; opacity: .8; }
.enote { font-size: .82rem; color: var(--cream); margin-top: .35rem; opacity: .7; }
.edel { background: transparent; border: none; color: var(--bdr); font-size: 1rem; cursor: pointer; transition: color .2s; }
.edel:hover { color: var(--red); }
.empty { text-align: center; padding: 2rem; color: var(--warm); opacity: .4; font-size: .9rem; }

/* ── PAGE: CHAT ── */
.who-toggle {
  display: flex; gap: .5rem; margin-bottom: 1rem;
}
.who-btn {
  flex: 1; padding: .5rem; border-radius: 8px;
  border: 1px solid var(--bdr); background: transparent;
  color: var(--warm); font-family: 'Assistant', sans-serif;
  font-size: .9rem; cursor: pointer; transition: all .2s;
}
.who-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(196,154,42,.08); }

.chat-box {
  height: 55vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: .6rem;
  padding: .5rem 0 1rem; margin-bottom: .8rem;
}
.chat-box::-webkit-scrollbar { width: 4px; }
.chat-box::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 4px; }

.bubble-wrap { display: flex; }
.bubble-wrap.mine { justify-content: flex-end; }
.bubble-wrap.hers { justify-content: flex-start; }

.bubble {
  max-width: 72%; padding: .6rem .9rem;
  border-radius: 14px; font-size: .9rem; line-height: 1.4;
}
.bubble-wrap.mine .bubble {
  background: rgba(196,154,42,.18);
  border: 1px solid rgba(196,154,42,.3);
  color: var(--cream);
}
.bubble-wrap.hers .bubble {
  background: var(--surf2);
  border: 1px solid var(--bdr);
  color: var(--cream);
}
.bubble-sender { font-size: .68rem; color: var(--warm); margin-bottom: .15rem; opacity: .7; }
.bubble-time { font-size: .65rem; color: var(--warm); margin-top: .25rem; text-align: left; opacity: .5; }

.chat-input-row { display: flex; gap: .6rem; }
.chat-input-row input {
  flex: 1; background: var(--surf); border: 1px solid var(--bdr);
  color: var(--cream); padding: .7rem 1rem; border-radius: 10px;
  font-family: 'Assistant', sans-serif; font-size: .95rem; outline: none;
}
.chat-input-row input:focus { border-color: var(--gold); }
.send-btn {
  padding: .7rem 1rem; background: var(--gold); color: var(--bg);
  border: none; border-radius: 10px; font-size: 1rem; cursor: pointer;
}
.chat-clear {
  text-align: center; margin-top: .8rem;
  font-size: .78rem; color: var(--warm); opacity: .4; cursor: pointer; text-decoration: underline;
}
.chat-clear:hover { opacity: .8; }

/* ── PAGE: WISHLIST ── */
.wish-add { display: flex; gap: .6rem; margin-bottom: 1.2rem; }
.wish-add input {
  flex: 1; background: var(--surf); border: 1px solid var(--bdr);
  color: var(--cream); padding: .7rem 1rem; border-radius: 10px;
  font-family: 'Assistant', sans-serif; font-size: .95rem; outline: none;
}
.wish-add input:focus { border-color: var(--gold); }
.wish-add button {
  padding: .7rem 1.1rem; background: var(--gold); color: var(--bg);
  border: none; border-radius: 10px; font-size: 1rem; cursor: pointer;
  font-weight: 700;
}
.wish-category-tabs { display: flex; gap: .4rem; margin-bottom: 1rem; flex-wrap: wrap; }
.wcat-btn {
  padding: .3rem .8rem; border-radius: 20px; border: 1px solid var(--bdr);
  background: transparent; color: var(--warm); font-size: .8rem; cursor: pointer;
}
.wcat-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(196,154,42,.08); }

.wish-list { display: flex; flex-direction: column; gap: .6rem; }
.wish-card {
  background: var(--surf); border: 1px solid var(--bdr); border-radius: 10px;
  padding: .9rem 1rem; display: flex; align-items: center; gap: .8rem;
}
.wish-check {
  width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--bdr);
  flex-shrink: 0; cursor: pointer; transition: all .2s; display: flex;
  align-items: center; justify-content: center; font-size: .75rem; color: transparent;
}
.wish-card.done .wish-check { border-color: var(--gold); background: var(--gold); color: var(--bg); }
.wish-card.done .wish-text { text-decoration: line-through; opacity: .45; }
.wish-text { flex: 1; font-size: .92rem; }
.wish-cat { font-size: .7rem; color: var(--warm); opacity: .6; margin-top: .15rem; }
.wish-del { background: transparent; border: none; color: var(--bdr); font-size: .95rem; cursor: pointer; }
.wish-del:hover { color: var(--red); }

/* ── GAME ── */
#pg-game { padding-top: 1.2rem; }
.game-header { text-align: center; padding: .5rem 0 1.2rem; }
.game-header h2 { font-family: 'Frank Ruhl Libre', serif; font-size: 1.5rem; font-weight: 900; color: var(--gold); }
.game-header p { font-size: .82rem; color: var(--warm); margin-top: .2rem; opacity: .7; }

.level-tabs { display: flex; gap: .4rem; justify-content: center; margin-bottom: 1rem; }
.lvl-btn {
  flex: 1; padding: .45rem .2rem; border-radius: 20px;
  border: 1px solid var(--bdr); background: transparent;
  color: var(--warm); font-size: .8rem; cursor: pointer; transition: all .2s;
  font-family: 'Assistant', sans-serif;
}
.lvl-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(196,154,42,.1); }
.lvl-btn[data-lv="hot"].active { border-color: #c44; color: #c44; background: rgba(168,24,24,.1); }
.lvl-btn[data-lv="wild"].active { border-color: #a840a8; color: #cc55cc; background: rgba(168,40,168,.1); }

.type-tabs { display: flex; gap: .4rem; justify-content: center; margin-bottom: 1.4rem; }
.type-btn {
  flex: 1; padding: .4rem; border-radius: 8px;
  border: 1px solid var(--bdr); background: transparent;
  color: var(--warm); font-size: .85rem; cursor: pointer; transition: all .2s;
  font-family: 'Assistant', sans-serif;
}
.type-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(196,154,42,.1); }

/* card flip */
.card-scene {
  width: 100%; max-width: 340px; height: 220px;
  margin: 0 auto 1.4rem; perspective: 900px;
  cursor: pointer;
}
.card-3d {
  width: 100%; height: 100%;
  position: relative; transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.4,0,.2,1);
}
.card-3d.flipped { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0;
  border-radius: 16px; backface-visibility: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 1.5rem 1.2rem; text-align: center;
}
.card-front {
  background: var(--surf);
  border: 1px solid var(--bdr);
}
.card-front-icon { font-size: 3rem; line-height: 1; margin-bottom: .6rem; }
.card-front-hint { font-size: .8rem; color: var(--warm); opacity: .6; }
.card-back {
  background: linear-gradient(135deg, #1a1208, #0f0a04);
  border: 1px solid var(--gold);
  transform: rotateY(180deg);
}
.card-type-badge {
  font-size: .7rem; letter-spacing: .12em; text-transform: uppercase;
  border-radius: 20px; padding: .2rem .7rem; margin-bottom: .8rem;
  font-family: 'Assistant', sans-serif; font-weight: 600;
}
.badge-truth { background: rgba(196,154,42,.2); color: var(--gold); border: 1px solid rgba(196,154,42,.4); }
.badge-dare  { background: rgba(168,24,24,.2);  color: #e05050;   border: 1px solid rgba(168,24,24,.4); }
.card-text {
  font-family: 'Frank Ruhl Libre', serif; font-size: 1.1rem;
  font-weight: 700; color: var(--cream); line-height: 1.5;
}
.card-level-dot {
  position: absolute; top: .7rem; left: .7rem;
  width: 8px; height: 8px; border-radius: 50%;
}

.game-actions { display: flex; gap: .6rem; justify-content: center; margin-bottom: 1rem; }
#next-card-btn {
  flex: 1; max-width: 220px; padding: .85rem;
  background: var(--gold); color: var(--bg); border: none;
  border-radius: 12px; font-family: 'Frank Ruhl Libre', serif;
  font-size: 1.05rem; font-weight: 900; cursor: pointer; transition: all .2s;
}
#next-card-btn:hover { background: var(--warm); }
#skip-btn {
  padding: .85rem 1rem; background: transparent; border: 1px solid var(--bdr);
  color: var(--warm); border-radius: 12px; font-size: .85rem; cursor: pointer;
  font-family: 'Assistant', sans-serif;
}
#skip-btn:hover { border-color: var(--warm); }

.game-score {
  display: flex; justify-content: center; gap: 2rem;
  padding: .8rem; border-top: 1px solid var(--bdr); margin-top: .5rem;
}
.gscore { text-align: center; }
.gscore-num { font-family: 'Frank Ruhl Libre', serif; font-size: 1.6rem; font-weight: 900; color: var(--gold); }
.gscore-lbl { font-size: .7rem; color: var(--warm); opacity: .6; }
.game-done-strip {
  display: none; text-align: center; padding: 1rem;
  background: rgba(196,154,42,.05); border: 1px solid rgba(196,154,42,.2);
  border-radius: 12px; margin-bottom: 1rem; color: var(--warm); font-size: .9rem;
}
.game-done-strip.show { display: block; }

/* ── SETTINGS MINI ── */
#settings-bar {
  display: flex; gap: .5rem; justify-content: center; padding: .8rem 0;
  border-top: 1px solid var(--bdr); margin-top: 1rem;
}
.mini-btn {
  background: transparent; border: 1px solid var(--bdr); color: var(--warm);
  border-radius: 8px; padding: .4rem .9rem; font-size: .78rem; cursor: pointer;
  font-family: 'Assistant', sans-serif;
}
.mini-btn:hover { border-color: var(--warm); }

/* ── MODALS ── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.85);
  display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--surf); border: 1px solid var(--bdr); border-radius: 16px;
  padding: 1.8rem; width: 100%; max-width: 380px;
}
.modal h2 { font-family: 'Frank Ruhl Libre', serif; font-size: 1.4rem; font-weight: 700; color: var(--gold); margin-bottom: 1.4rem; }
.fg { margin-bottom: 1.1rem; }
.fg label { display: block; font-size: .83rem; color: var(--warm); margin-bottom: .35rem; }
.fg input, .fg textarea, .fg select {
  width: 100%; background: var(--bg); border: 1px solid var(--bdr);
  color: var(--cream); padding: .65rem .9rem; border-radius: 8px;
  font-family: 'Assistant', sans-serif; font-size: .93rem; outline: none;
}
.fg input:focus, .fg textarea:focus { border-color: var(--gold); }
.fg textarea { resize: vertical; min-height: 70px; }
.mood-grid { display: flex; gap: .4rem; flex-wrap: wrap; }
.mood-btn {
  padding: .35rem .8rem; border: 1px solid var(--bdr); border-radius: 20px;
  background: transparent; color: var(--cream); font-size: .85rem; cursor: pointer;
}
.mood-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(196,154,42,.1); }
.modal-actions { display: flex; gap: .7rem; margin-top: 1.4rem; }
.btn-save {
  flex: 1; padding: .75rem; background: var(--gold); color: var(--bg);
  border: none; border-radius: 8px; font-family: 'Frank Ruhl Libre', serif;
  font-size: 1rem; font-weight: 700; cursor: pointer;
}
.btn-cancel {
  padding: .75rem 1.1rem; background: transparent; color: var(--warm);
  border: 1px solid var(--bdr); border-radius: 8px; font-size: .88rem; cursor: pointer;
}
</style>
</head>
<body>

<!-- ═══ PIN SCREEN ═══ -->
<div id="pin-screen">
  <h1>🔐 פרטי</h1>
  <div id="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div id="pin-pad">
    <button class="pb" data-n="1">1</button><button class="pb" data-n="2">2</button><button class="pb" data-n="3">3</button>
    <button class="pb" data-n="4">4</button><button class="pb" data-n="5">5</button><button class="pb" data-n="6">6</button>
    <button class="pb" data-n="7">7</button><button class="pb" data-n="8">8</button><button class="pb" data-n="9">9</button>
    <button class="pb sm" data-n="del">⌫</button><button class="pb" data-n="0">0</button><button class="pb sm" data-n="ok">OK</button>
  </div>
  <div id="pin-err"></div>
</div>

<!-- ═══ MAIN APP ═══ -->
<div id="app">

  <!-- ─ TAB: DASHBOARD ─ -->
  <div class="page active" id="pg-dash">
    <header>
      <h1>אילן ❤️</h1>
      <p id="last-txt">טוען...</p>
    </header>

    <div class="stats-strip">
      <div class="stat-box"><div class="stat-num" id="sw">0</div><div class="stat-lbl">השבוע</div></div>
      <div class="stat-box"><div class="stat-num" id="sm">0</div><div class="stat-lbl">החודש</div></div>
      <div class="stat-box"><div class="stat-num" id="st">0</div><div class="stat-lbl">סה"כ</div></div>
    </div>

    <button id="log-btn">+ רשום עכשיו</button>

    <div class="section-title" style="margin-bottom:.8rem">
      <span>קלנדר</span>
    </div>
    <div class="cal-nav">
      <button id="cal-prev">‹</button>
      <div class="cal-month" id="cal-lbl"></div>
      <button id="cal-next">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>

    <div class="section-title">
      היסטוריה <small id="hist-cnt"></small>
    </div>
    <div class="entry-list" id="entry-list"></div>

    <div id="settings-bar">
      <button class="mini-btn" id="change-pin-btn">שנה PIN</button>
      <button class="mini-btn" id="lock-btn">🔒 נעל</button>
    </div>
  </div>

  <!-- ─ TAB: CHAT ─ -->
  <div class="page" id="pg-chat">
    <div style="padding-top:1.5rem">
      <div class="section-title">
        💬 צ'אט פרטי זוגי
        <small id="chat-clear" style="cursor:pointer;text-decoration:underline">נקה הכל</small>
      </div>

      <div class="who-toggle">
        <button class="who-btn active" data-who="ilan">👨 אילן</button>
        <button class="who-btn" data-who="wife">👩 אשתי</button>
      </div>

      <div class="chat-box" id="chat-box">
        <div class="empty" id="chat-empty">עדיין אין הודעות — התחילו לשוחח 💬</div>
      </div>

      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="כתוב משהו..." maxlength="500">
        <button class="send-btn" id="send-btn">שלח</button>
      </div>
    </div>
  </div>

  <!-- ─ TAB: WISHLIST ─ -->
  <div class="page" id="pg-wish">
    <div style="padding-top:1.5rem">
      <div class="section-title">✨ משאלות וחלומות</div>

      <div class="wish-add">
        <input type="text" id="wish-input" placeholder="הוסף משאלה..." maxlength="200">
        <button id="wish-add-btn">+</button>
      </div>

      <div class="wish-category-tabs" id="wish-cats">
        <button class="wcat-btn active" data-cat="הכל">הכל</button>
        <button class="wcat-btn" data-cat="🔥 אינטימי">🔥 אינטימי</button>
        <button class="wcat-btn" data-cat="🌍 טיול">🌍 טיול</button>
        <button class="wcat-btn" data-cat="🍽️ אוכל">🍽️ אוכל</button>

<!-- ═══ CHANGE PIN MODAL ═══ -->
<div class="modal-bg" id="modal-pin">
  <div class="modal">
    <h2>שנה PIN</h2>
    <div class="fg"><label>PIN נוכחי</label><input type="password" inputmode="numeric" maxlength="4" id="p-old" placeholder="••••"></div>
    <div class="fg"><label>PIN חדש (4 ספרות)</label><input type="password" inputmode="numeric" maxlength="4" id="p-new" placeholder="••••"></div>
    <div class="fg"><label>אשר PIN חדש</label><input type="password" inputmode="numeric" maxlength="4" id="p-new2" placeholder="••••"></div>

      <button class="btn-save" id="p-save">שמור</button>
      <button class="btn-cancel" id="p-cancel">ביטול</button>

<!-- ═══ WISH CATEGORY PICKER ═══ -->
<div class="modal-bg" id="modal-wish">
  <div class="modal">
    <h2>קטגוריה</h2>
    <div style="display:flex;flex-direction:column;gap:.6rem" id="wish-cat-pick">
      <button class="btn-save" style="background:var(--surf);color:var(--cream);border:1px solid var(--bdr)" data-wc="🔥 אינטימי">🔥 אינטימי</button>
      <button class="btn-save" style="background:var(--surf);color:var(--cream);border:1px solid var(--bdr)" data-wc="🌍 טיול">🌍 טיול</button>
      <button class="btn-save" style="background:var(--surf);color:var(--cream);border:1px solid var(--bdr)" data-wc="🍽️ אוכל">🍽️ אוכל</button>
      <button class="btn-save" style="background:var(--surf);color:var(--cream);border:1px solid var(--bdr)" data-wc="💆 פינוק">💆 פינוק</button>
      <button class="btn-save" style="background:var(--surf);color:var(--cream);border:1px solid var(--bdr)" data-wc="💫 אחר">💫 אחר</button>
    </div>

<script>
// ── KEYS ──
const K_PIN  = 'cp_pin';
const K_LOG  = 'cp_log';
const K_CHAT = 'cp_chat';
const K_WISH = 'cp_wish';
const DEF_PIN = '1234';

// ── HELPERS ──
const g  = id => document.getElementById(id);
const gs = s  => document.querySelectorAll(s);
const getPin  = () => localStorage.getItem(K_PIN) || DEF_PIN;
const getLogs = () => JSON.parse(localStorage.getItem(K_LOG)  || '[]');
const getMsgs = () => JSON.parse(localStorage.getItem(K_CHAT) || '[]');
const getWish = () => JSON.parse(localStorage.getItem(K_WISH) || '[]');
const saveLogs = v => localStorage.setItem(K_LOG,  JSON.stringify(v));
const saveMsgs = v => localStorage.setItem(K_CHAT, JSON.stringify(v));
const saveWish = v => localStorage.setItem(K_WISH, JSON.stringify(v));

// ── PIN ──
let pinBuf = '';
gs('.pb').forEach(b => b.addEventListener('click', () => {
  const n = b.dataset.n;
  if (n==='del') pinBuf = pinBuf.slice(0,-1);
  else if (n==='ok') checkPin();
  else if (pinBuf.length < 4) { pinBuf += n; if (pinBuf.length===4) checkPin(); }
  updateDots();
}));

function updateDots() {
  for (let i=0;i<4;i++) g('d'+i).classList.toggle('f', i < pinBuf.length);
}
function checkPin() {
  if (pinBuf === getPin()) {
    g('pin-screen').style.display = 'none';
    g('app').style.display = 'block';
    initApp();
  } else {
    g('pin-err').textContent = 'קוד שגוי';
    pinBuf = ''; updateDots();
    setTimeout(() => g('pin-err').textContent='', 1500);
  }
}

// ── TABS ──
gs('.tab-btn').forEach(b => b.addEventListener('click', () => {
  gs('.tab-btn').forEach(x => x.classList.remove('active'));
  gs('.page').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  g('pg-'+b.dataset.tab).classList.add('active');
  if (b.dataset.tab==='chat') scrollChat();
}));

// ── INIT ──
let calY, calM, curWho='ilan', curWCat='הכל', pendingWish='';

function initApp() {
  const now = new Date();
  calY = now.getFullYear(); calM = now.getMonth();
  renderDash(); renderChat(); renderWish();
  resetGame();
}

// ──────────── DASHBOARD ────────────
function renderDash() { renderStats(); renderCalendar(); renderHistory(); }

function renderStats() {
  const logs = getLogs(), now = new Date();
  const wa = new Date(now); wa.setDate(now.getDate()-7);
  const ms = new Date(now.getFullYear(), now.getMonth(), 1);
  g('sw').textContent = logs.filter(e=>new Date(e.dt)>=wa).length;
  g('sm').textContent = logs.filter(e=>new Date(e.dt)>=ms).length;
  g('st').textContent = logs.length;
  if (!logs.length) { g('last-txt').textContent='עדיין לא רשמתם'; return; }
  const diff = Math.floor((now - new Date(logs[0].dt))/86400000);
  g('last-txt').textContent = diff===0?'היום! 🔥':diff===1?'אתמול':`לפני ${diff} ימים`;
}

const HE_M=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HE_D=['א','ב','ג','ד','ה','ו','ש'];

function renderCalendar() {
  g('cal-lbl').textContent = `${HE_M[calM]} ${calY}`;
  const logs = getLogs();
  const evDays = new Set(logs.filter(e=>{
    const d=new Date(e.dt); return d.getFullYear()===calY && d.getMonth()===calM;
  }).map(e=>new Date(e.dt).getDate()));
  const grid = g('cal-grid');
  grid.innerHTML = '';
  HE_D.forEach(d => { const el=document.createElement('div'); el.className='cdn'; el.textContent=d; grid.appendChild(el); });
  const fd = new Date(calY,calM,1).getDay();
  for(let i=0;i<fd;i++){const el=document.createElement('div');el.className='cd';grid.appendChild(el);}
  const dim = new Date(calY,calM+1,0).getDate(), today=new Date();
  for(let d=1;d<=dim;d++){
    const el=document.createElement('div'); el.className='cd'; el.textContent=d;
    if(today.getDate()===d&&today.getMonth()===calM&&today.getFullYear()===calY) el.classList.add('tod');
    if(evDays.has(d)) el.classList.add('ev');
    grid.appendChild(el);
  }
}
g('cal-prev').onclick=()=>{calM--;if(calM<0){calM=11;calY--;}renderCalendar();};
g('cal-next').onclick=()=>{calM++;if(calM>11){calM=0;calY++;}renderCalendar();};

function renderHistory() {
  const logs = getLogs(), list = g('entry-list');
  g('hist-cnt').textContent = logs.length ? `${logs.length} רשומות` : '';
  if (!logs.length) { list.innerHTML='<div class="empty">עדיין אין רשומות</div>'; return; }
  list.innerHTML = logs.map((e,i)=>{
    const d=new Date(e.dt);
    const ds=d.toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});
    const ts=d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    return `<div class="ecard">
      <div>
        <div class="edate">${ds}</div>
        <div class="emeta">${ts}${e.mood?' · '+e.mood:''}</div>
        ${e.note?`<div class="enote">${e.note}</div>`:''}
      </div>
      <button class="edel" data-i="${i}">✕</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.edel').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm('למחוק רשומה זו?')) return;
    const logs=getLogs(); logs.splice(+b.dataset.i,1); saveLogs(logs);
    renderDash();
  }));
}

// LOG MODAL
g('log-btn').onclick=()=>{
  const now=new Date();
  const loc=new Date(now-now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  g('e-dt').value=loc; g('e-note').value='';
  gs('.mood-btn').forEach(b=>b.classList.remove('active'));
  selectedMood='';
  g('modal-log').classList.add('open');
};
g('e-cancel').onclick=()=>g('modal-log').classList.remove('open');
g('modal-log').onclick=function(e){if(e.target===this)this.classList.remove('open');};

let selectedMood='';
gs('.mood-btn').forEach(b=>b.addEventListener('click',()=>{
  selectedMood=b.dataset.m;
  gs('.mood-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
}));

g('e-save').onclick=()=>{
  const dt=g('e-dt').value; if(!dt){alert('בחר תאריך');return;}
  const logs=getLogs();
  logs.unshift({dt:new Date(dt).toISOString(), mood:selectedMood, note:g('e-note').value.trim()});
  logs.sort((a,b)=>new Date(b.dt)-new Date(a.dt));
  saveLogs(logs);
  g('modal-log').classList.remove('open');
  renderDash();
};

// ──────────── CHAT ────────────
function renderChat() {
  const msgs = getMsgs(), box = g('chat-box');
  g('chat-empty').style.display = msgs.length ? 'none' : 'block';
  const existing = box.querySelectorAll('.bubble-wrap');
  existing.forEach(e=>e.remove());
  msgs.forEach(m => box.appendChild(makeBubble(m)));
  scrollChat();
}

function makeBubble(m) {
  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap '+(m.who==='ilan'?'mine':'hers');
  const d = new Date(m.ts);
  const ts = d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})+' '+d.toLocaleDateString('he-IL',{day:'numeric',month:'numeric'});
  wrap.innerHTML = `<div class="bubble">
    <div class="bubble-sender">${m.who==='ilan'?'👨 אילן':'👩 אשתי'}</div>
    <div>${m.text}</div>
    <div class="bubble-time">${ts}</div>
  </div>`;
  return wrap;
}

function scrollChat() {
  const box=g('chat-box'); box.scrollTop=box.scrollHeight;
}

gs('.who-btn').forEach(b=>b.addEventListener('click',()=>{
  curWho=b.dataset.who;
  gs('.who-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
}));

function sendMsg() {
  const input=g('chat-input'), text=input.value.trim();
  if(!text) return;
  const msgs=getMsgs();
  msgs.push({who:curWho, text, ts:new Date().toISOString()});
  saveMsgs(msgs);
  input.value='';
  renderChat();
}
g('send-btn').onclick=sendMsg;
g('chat-input').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});
g('chat-clear').onclick=()=>{
  if(!confirm('למחוק את כל השיחה?')) return;
  saveMsgs([]); renderChat();
};

// ──────────── WISHLIST ────────────
function renderWish() {
  const wishes=getWish(), list=g('wish-list');
  const filtered = curWCat==='הכל' ? wishes : wishes.filter(w=>w.cat===curWCat);
  if(!filtered.length){list.innerHTML='<div class="empty">אין משאלות כאן עדיין ✨</div>';return;}
  list.innerHTML=filtered.map((w,_)=>{
    const ri=wishes.indexOf(w);
    return `<div class="wish-card${w.done?' done':''}">
      <div class="wish-check" data-ri="${ri}">✓</div>
      <div style="flex:1">
        <div class="wish-text">${w.text}</div>
        <div class="wish-cat">${w.cat}</div>
      </div>
      <button class="wish-del" data-ri="${ri}">✕</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.wish-check').forEach(b=>b.addEventListener('click',()=>{
    const wishes=getWish(); wishes[+b.dataset.ri].done=!wishes[+b.dataset.ri].done;
    saveWish(wishes); renderWish();
  }));
  list.querySelectorAll('.wish-del').forEach(b=>b.addEventListener('click',()=>{
    if(!confirm('למחוק?')) return;
    const wishes=getWish(); wishes.splice(+b.dataset.ri,1); saveWish(wishes); renderWish();
  }));
}

gs('.wcat-btn').forEach(b=>b.addEventListener('click',()=>{
  curWCat=b.dataset.cat;
  gs('.wcat-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  renderWish();
}));

g('wish-add-btn').onclick=()=>{
  const text=g('wish-input').value.trim();
  if(!text) return;
  pendingWish=text;
  g('modal-wish').classList.add('open');
};
g('wish-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'){g('wish-add-btn').click();}
});

gs('#wish-cat-pick button').forEach(b=>b.addEventListener('click',()=>{
  const wishes=getWish();
  wishes.push({text:pendingWish, cat:b.dataset.wc, done:false, ts:new Date().toISOString()});
  saveWish(wishes);
  g('wish-input').value=''; pendingWish='';
  g('modal-wish').classList.remove('open');
  renderWish();
}));
g('wc-cancel').onclick=()=>g('modal-wish').classList.remove('open');
g('modal-wish').onclick=function(e){if(e.target===this){this.classList.remove('open');}};

// ──────────── PIN CHANGE ────────────
g('change-pin-btn').onclick=()=>{
  ['p-old','p-new','p-new2'].forEach(id=>g(id).value='');
  g('pin-err2').textContent='';
  g('modal-pin').classList.add('open');
};
g('p-cancel').onclick=()=>g('modal-pin').classList.remove('open');
g('modal-pin').onclick=function(e){if(e.target===this)this.classList.remove('open');};
g('p-save').onclick=()=>{
  const old=g('p-old').value, n1=g('p-new').value, n2=g('p-new2').value, err=g('pin-err2');
  if(old!==getPin()){err.textContent='PIN נוכחי שגוי';return;}
  if(!/^\d{4}$/.test(n1)){err.textContent='חייב להיות 4 ספרות';return;}
  if(n1!==n2){err.textContent='הקודים לא תואמים';return;}
  localStorage.setItem(K_PIN,n1);
  g('modal-pin').classList.remove('open');
  alert('PIN שונה ✓');
};

// ──────────── GAME ────────────
const CARDS = {
  soft: {
    truth: [
      'מה הדבר הכי רומנטי שאי פעם עשיתי לך?',
      'מתי הרגשת הכי קרוב/ה אלי?',
      'מה הזיכרון הרומנטי האהוב עליך שלנו?',
      'מה אתה/את הכי אוהב/ת שאני עושה לך?',
      'לאן הכי בא לך שנסע ביחד?',
      'מה הדבר שגורם לך להרגיש הכי אהוב/ה?',
      'מה הייתה הדייט המושלמת שלך איתי?',
      'מה אתה/את הכי אוהב/ת בגוף שלי?',
      'איזה שיר מזכיר לך אותנו?',
      'מה אתה/את מקווה שנעשה ביחד השנה?',
    ],
    dare: [
      'תן/י לי נשיקה ארוכה בלי לעצור',
      'לחש/י לי דבר שאתה/את אוהב/ת בי',
      'תעשה/י לי עיסוי ידיים של 3 דקות',
      'תחבק/י אותי חיבוק שלא ממהר לשחרר',
      'ספר/י לי מה אהבת בפעם הראשונה שפגשנו',
      'תכין/י לי משהו לשתות ותביא/י עם נשיקה',
      'תשיר/י לי שורה מהשיר האהוב עליך',
      'תספר/י לי את הדבר הכי יפה שאתה/את חושב/ת עלי',
      'תרקד/י איתי לשיר אחד איטי',
      'תכתוב/כתבי לי הודעה שתישמר לתמיד',
    ],
  },
  hot: {
    truth: [
      'איפה הכי בא לך שאגע בך?',
      'מה הדבר הכי חושני שאני עושה?',
      'מה הפנטזיה שמעולם לא סיפרת לי?',
      'איזה לבוש הכי מגרה עלי לפי דעתך?',
      'מה הדבר שהכי בא לך שננסה?',
      'מה הכי מגרה אותך בלי מגע?',
      'מה אתה/את חושב/ת עלי כשאתה/את מרחוק?',
      'מה הדבר שגורם לך להרגיש הכי מיני?',
      'מה הייתה הרגע הכי חושני שלנו?',
      'מה הסוד הכי קטן שלך שעוד לא סיפרת לי?',
    ],
    dare: [
      'תנשק/י אותי בכל הצוואר',
      'תעשה/י לי עיסוי גב של 5 דקות',
      'תגיד/י לי בדיוק מה אתה/את רוצה שאעשה לך הלילה',
      'שלח/י לי הודעת וואטסאפ מגרה ממש עכשיו',
      'תרד/י בנשיקות מהצוואר לכתף',
      'תגלה/י קצת יותר ממה שרגיל/ה',
      'תעשה/י לי עיסוי כתפיים ותלחש/י לי משהו',
      'תסתכל/י לי בעיניים חצי דקה בלי להסיט מבט',
      'תנשק/י אותי על האוזן',
      'תכתוב/כתבי על ידי שלי פנטזיה קטנה',
    ],
  },
  wild: {
    truth: [
      'מה הפנטזיה הכי פרועה שלך?',
      'מה הדבר שהכי בא לך שנעשה שעדיין לא עשינו?',
      'מה המקום הכי לא צפוי שבא לך שנהיה בו אינטימיים?',
      'מה ה"כן גדול" שלך שעדיין לא אמרת לי?',
      'מה הדבר שגורם לך להרגיש הכי סקסי?',
      'אם היינו לבד שבוע שלם בלי שום דאגה — מה היית רוצה שנעשה?',
      'מה הפנטזיה שהכי בושה לך לספר לי?',
      'מה הייתה הנשיקה הכי טובה שקיבלת?',
      'מה הדבר שאני עושה שמשגע/ת אותך הכי הרבה?',
      'מה הייתה הרגע הכי נועז שלנו?',
    ],
    dare: [
      'הפתע/י אותי בנשיקה איפה שאתה/את בוחר/ת',
      'תגלה/י לי פנטזיה אחת שעדיין לא סיפרת לי — בפירוט',
      'תעשה/י לי משהו שיגרום לי לרצות אותך',
      'תבחר/י מוזיקה מגרה ותרקד/י לידי',
      'שלח/י לי תמונה שתגרום לי לרצות אותך',
      'תתאר/י לי פנטזיה בזמן שאתה/את מסתכל/ת לי בעיניים',
      'תנשק/י אותי 60 שניות בלי לעצור',
      'תגיד/י לי בדיוק מה אתה/את רוצה שיקרה הלילה',
      'תוריד/י בנשיקות מהצוואר לשכם ומשם',
      'תבצע/י עיסוי של 10 דקות בלי לדבר — רק מגע',
    ],
  },
};

const LV_COLOR = { soft: '#c49a2a', hot: '#c44444', wild: '#cc55cc' };

let gameLv = 'soft', gameTp = 'mix', gameIdx = -1, gameUsed = [];
let gRound = 0, gTruth = 0, gDare = 0;

function gamePool() {
  const lv = CARDS[gameLv];
  if (gameTp === 'truth') return lv.truth.map(t=>({t:'truth',q:t}));
  if (gameTp === 'dare')  return lv.dare.map(t=>({t:'dare',q:t}));
  return [...lv.truth.map(t=>({t:'truth',q:t})), ...lv.dare.map(t=>({t:'dare',q:t}))];
}

function shuffleArray(a) {
  const arr = [...a];
  for (let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

let gameShuffled = [];

function resetGame() {
  gameShuffled = shuffleArray(gamePool());
  gameIdx = -1;
  g('game-done').classList.remove('show');
  // reset card to front
  g('card-3d').classList.remove('flipped');
}

function drawCard() {
  gameIdx++;
  if (gameIdx >= gameShuffled.length) {
    gameShuffled = shuffleArray(gamePool());
    gameIdx = 0;
    g('game-done').classList.remove('show');
  }
  const card = gameShuffled[gameIdx];
  g('card-text').textContent = card.q;
  const badge = g('card-badge');
  badge.textContent = card.t === 'truth' ? 'אמת' : 'העזה';
  badge.className = 'card-type-badge ' + (card.t==='truth'?'badge-truth':'badge-dare');
  g('card-lvl-dot').style.background = LV_COLOR[gameLv];

  gRound++;
  if (card.t==='truth') gTruth++; else gDare++;
  g('gs-round').textContent = gRound;
  g('gs-truth').textContent = gTruth;
  g('gs-dare').textContent  = gDare;

  if (gameIdx === gameShuffled.length - 1) g('game-done').classList.add('show');
}

function flipCard(draw) {
  const card3d = g('card-3d');
  if (!card3d.classList.contains('flipped')) {
    drawCard();
    card3d.classList.add('flipped');
  } else {
    card3d.classList.remove('flipped');
    setTimeout(() => { if (draw) { drawCard(); card3d.classList.add('flipped'); } }, 300);
  }
}

g('card-scene').addEventListener('click', () => flipCard(false));
g('next-card-btn').addEventListener('click', () => {
  const card3d = g('card-3d');
  if (!card3d.classList.contains('flipped')) {
    drawCard();
    card3d.classList.add('flipped');
  } else {
    card3d.classList.remove('flipped');
    setTimeout(() => { drawCard(); card3d.classList.add('flipped'); }, 320);
  }
});
g('skip-btn').addEventListener('click', () => {
  const card3d = g('card-3d');
  card3d.classList.remove('flipped');
  setTimeout(() => { drawCard(); card3d.classList.add('flipped'); }, 320);
});

gs('.lvl-btn').forEach(b => b.addEventListener('click', () => {
  gameLv = b.dataset.lv;
  gs('.lvl-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  g('card-3d').classList.remove('flipped');
  resetGame();
}));

gs('.type-btn').forEach(b => b.addEventListener('click', () => {
  gameTp = b.dataset.tp;
  gs('.type-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  g('card-3d').classList.remove('flipped');
  resetGame();
}));

// ──────────── LOCK ────────────
g('lock-btn').onclick=()=>{
  g('app').style.display='none';
  g('pin-screen').style.display='flex';
  pinBuf=''; updateDots(); g('pin-err').textContent='';
};
</script>
