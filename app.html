<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="עוזר חכם">
<title>עוזר חכם 🧠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07080f;
  --bg2:#0d0f1c;
  --card:#10132a;
  --card2:#141729;
  --border:rgba(120,80,255,0.18);
  --purple:#8b5cf6;
  --purple2:#a78bfa;
  --blue:#3b82f6;
  --pink:#ec4899;
  --orange:#f97316;
  --green:#22c55e;
  --yellow:#eab308;
  --cyan:#06b6d4;
  --text:#f0f4ff;
  --text2:#94a3b8;
  --text3:#4a5568;
  --glow-p:rgba(139,92,246,0.35);
  --glow-b:rgba(59,130,246,0.35);
  --glow-pk:rgba(236,72,153,0.35);
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
html{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden;background:var(--bg)}
button{cursor:pointer;font-family:inherit;border:none;background:none}

/* Scrollbar */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* App */
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(72px + var(--sb))}

/* ── Header ── */
.header{
  padding:calc(var(--st) + 16px) 20px 16px;
  background:linear-gradient(180deg,rgba(7,8,15,1) 0%,rgba(7,8,15,0) 100%);
  position:sticky;top:0;z-index:50;
}
.header-row{display:flex;align-items:center;justify-content:space-between}
.greeting{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#a78bfa,#60a5fa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-time{text-align:left}
.time-val{font-size:1.3rem;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.date-val{font-size:.72rem;color:var(--text2)}

/* ── Stats row ── */
.stats-row{display:flex;gap:10px;padding:4px 20px 16px;overflow-x:auto;scrollbar-width:none}
.stats-row::-webkit-scrollbar{display:none}
.stat-card{
  flex-shrink:0;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 16px;
  min-width:90px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.stat-card::before{content:'';position:absolute;inset:0;background:var(--sc-bg,transparent);opacity:.07;border-radius:14px}
.stat-val{font-size:1.4rem;font-weight:800;color:var(--sc-color,var(--purple2))}
.stat-label{font-size:.68rem;color:var(--text2);margin-top:2px;font-weight:500}
.stat-emoji{font-size:1.1rem;margin-bottom:4px}

/* ── Voice section ── */
.voice-section{padding:0 20px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}

.status-pill{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:999px;
  padding:8px 20px;
  font-size:.85rem;
  color:var(--text2);
  font-weight:500;
  transition:all .3s;
}
.status-pill.rec{color:#f87171;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);box-shadow:0 0 16px rgba(239,68,68,.2)}
.status-pill.ok{color:var(--green);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08)}

/* Waveform */
.wave-wrap{height:48px;width:100%;display:flex;align-items:center;justify-content:center;opacity:0;transform:scaleY(0);transition:.4s ease}
.wave-wrap.on{opacity:1;transform:scaleY(1)}
.wave{display:flex;align-items:center;gap:3px}
.wb{width:3px;border-radius:3px;height:6px;background:linear-gradient(to top,var(--purple),var(--pink))}
.wave.go .wb{animation:wv calc(.5s + var(--i)*.04s) ease-in-out infinite alternate;animation-delay:calc(var(--i)*.025s)}
@keyframes wv{0%,100%{height:6px}50%{height:calc(6px + var(--i)*2.5px + 8px)}}

/* Transcript */
.transcript{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:14px 16px;font-size:.95rem;line-height:1.6;min-height:64px;word-break:break-word;
  box-shadow:0 0 20px rgba(139,92,246,.08);
}
.tf{color:var(--text);font-weight:500}
.ti{color:var(--text3);font-style:italic}
.cur{color:var(--purple);animation:blink 1s step-end infinite;opacity:0}
.cur.on{opacity:1}
@keyframes blink{50%{opacity:0}0%,100%{opacity:1}}

/* Record button */
.rec-area{display:flex;flex-direction:column;align-items:center;gap:10px}
.rec-wrap{position:relative;width:86px;height:86px;display:flex;align-items:center;justify-content:center}
.rip{position:absolute;inset:-12px;border-radius:50%;border:2px solid var(--purple);opacity:0}
.rip.on{animation:rip 1.4s ease-out infinite}
@keyframes rip{0%{opacity:.7;transform:scale(.8)}100%{opacity:0;transform:scale(1.4)}}
.rip2{position:absolute;inset:-24px;border-radius:50%;border:1px solid var(--pink);opacity:0}
.rip2.on{animation:rip 1.4s ease-out .4s infinite}

.rbtn{
  width:86px;height:86px;border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#3b82f6);
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 30px var(--glow-p),0 0 60px rgba(139,92,246,.2);
  transition:transform .15s;z-index:1;position:relative;
}
.rbtn:active{transform:scale(.92)}
.rbtn.live{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 0 30px rgba(239,68,68,.5),0 0 60px rgba(239,68,68,.2);animation:pbtn 1.5s ease-in-out infinite}
@keyframes pbtn{0%,100%{box-shadow:0 0 30px rgba(239,68,68,.5)}50%{box-shadow:0 0 50px rgba(239,68,68,.8)}}
.mic,.stp{width:30px;height:30px}
.rec-label{font-size:.8rem;font-weight:600;color:var(--text2);letter-spacing:.03em}

/* Save area */
.save-area{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:16px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 0 24px var(--glow-p);
  animation:sup .3s ease;
}
.save-area.off{display:none}
@keyframes sup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.det-lbl{font-size:.72rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.type-btns{display:flex;gap:8px}
.tb{
  flex:1;padding:9px 6px;border-radius:10px;
  border:1.5px solid rgba(255,255,255,.08);
  color:var(--text2);font-size:.82rem;font-weight:600;
  transition:all .15s;text-align:center;
}
.tb.sel[data-t="task"]{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue);box-shadow:0 0 12px rgba(59,130,246,.3)}
.tb.sel[data-t="reminder"]{background:rgba(245,158,11,.15);border-color:var(--orange);color:var(--orange);box-shadow:0 0 12px rgba(245,158,11,.3)}
.tb.sel[data-t="idea"]{background:rgba(139,92,246,.15);border-color:var(--purple);color:var(--purple2);box-shadow:0 0 12px var(--glow-p)}
.save-actions{display:flex;gap:10px}
.btn-save{
  flex:1;padding:13px;border-radius:12px;
  background:linear-gradient(135deg,#7c3aed,#3b82f6);
  color:#fff;font-size:.95rem;font-weight:700;
  box-shadow:0 4px 20px var(--glow-p);transition:transform .1s;
}
.btn-save:active{transform:scale(.97)}
.btn-disc{padding:13px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.1);color:var(--text2);font-size:.88rem;font-weight:500}

/* ── Dashboard ── */
.dashboard{padding:0 20px;display:flex;flex-direction:column;gap:14px}
.dash-header{display:flex;align-items:center;justify-content:space-between}
.dash-title{font-size:1.05rem;font-weight:800;background:linear-gradient(135deg,var(--purple2),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.clr-btn{color:var(--text3);padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.06);transition:color .15s}
.clr-btn:hover{color:#f87171}

/* Filter tabs */
.ftabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ftabs::-webkit-scrollbar{display:none}
.ftab{
  flex-shrink:0;padding:7px 14px;border-radius:999px;
  border:1px solid rgba(255,255,255,.08);
  color:var(--text2);font-size:.78rem;font-weight:600;white-space:nowrap;transition:all .2s;
}
.ftab.active{background:linear-gradient(135deg,rgba(124,58,237,.3),rgba(59,130,246,.3));border-color:var(--purple);color:var(--purple2);box-shadow:0 0 12px var(--glow-p)}

/* Summary */
.sumrow{display:flex;gap:8px}
.chip{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:8px;border-radius:10px;font-size:.8rem;font-weight:700;
}
.tc{background:rgba(59,130,246,.12);color:var(--blue);border:1px solid rgba(59,130,246,.25)}
.rc{background:rgba(245,158,11,.12);color:var(--orange);border:1px solid rgba(245,158,11,.25)}
.ic{background:rgba(139,92,246,.12);color:var(--purple2);border:1px solid rgba(139,92,246,.25)}

/* Cards */
.cards-list{display:flex;flex-direction:column;gap:10px}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 20px;text-align:center}
.ei{font-size:3rem}
.et{font-size:1rem;font-weight:700;color:var(--text2)}
.es{font-size:.82rem;color:var(--text3);line-height:1.5;max-width:220px}

.card{
  display:flex;align-items:flex-start;gap:12px;
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px 16px;
  animation:cin .25s ease;transition:opacity .2s;
  position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;background:var(--cc,var(--purple));border-radius:0 14px 14px 0}
.card.task-card{--cc:var(--blue)}
.card.reminder-card{--cc:var(--orange)}
.card.idea-card{--cc:var(--purple)}
@keyframes cin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:translateX(0)}}
.card.done{opacity:.45}
.card.done .ct{text-decoration:line-through;color:var(--text3)}

.cchk{
  flex-shrink:0;width:24px;height:24px;border-radius:50%;
  border:2px solid rgba(255,255,255,.12);background:transparent;
  display:flex;align-items:center;justify-content:center;
  margin-top:1px;transition:all .15s;color:transparent;font-size:11px;font-weight:700;
}
.card.task-card .cchk:hover{border-color:var(--blue);background:rgba(59,130,246,.15)}
.card.reminder-card .cchk:hover{border-color:var(--orange);background:rgba(245,158,11,.15)}
.card.idea-card .cchk:hover{border-color:var(--purple);background:rgba(139,92,246,.15)}
.card.done .cchk{border-color:var(--text3);background:rgba(255,255,255,.06);color:var(--text3)}

.cbody{flex:1;min-width:0}
.ct{font-size:.93rem;color:var(--text);line-height:1.55;word-break:break-word}
.cmeta{display:flex;align-items:center;gap:8px;margin-top:6px}
.cbadge{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:999px}
.task-badge{background:rgba(59,130,246,.15);color:var(--blue)}
.reminder-badge{background:rgba(245,158,11,.15);color:var(--orange)}
.idea-badge{background:rgba(139,92,246,.15);color:var(--purple2)}
.ctime{font-size:.68rem;color:var(--text3)}

.cdel{flex-shrink:0;color:var(--text3);padding:4px;border-radius:6px;display:flex;align-items:center;transition:color .15s;opacity:0}
.card:hover .cdel,.cdel:focus{opacity:1}
.cdel:hover{color:#f87171}
@media(hover:none){.cdel{opacity:1}}

/* ── Bottom Nav ── */
.bnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;
  background:rgba(13,15,28,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:10px 20px calc(10px + var(--sb));
  display:flex;justify-content:space-around;align-items:center;
  z-index:50;
}
.bnav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text3);font-size:.65rem;font-weight:600;transition:color .2s;padding:4px 12px}
.bnav-btn svg{width:22px;height:22px}
.bnav-btn.active{color:var(--purple2)}
.bnav-btn.active svg{filter:drop-shadow(0 0 6px var(--purple))}

/* Toast */
.toast{
  position:fixed;bottom:calc(80px + var(--sb));right:50%;
  transform:translateX(50%) translateY(16px);
  background:var(--card2);color:var(--text);
  border:1px solid var(--border);padding:10px 22px;
  border-radius:999px;font-size:.85rem;font-weight:600;
  white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;z-index:200;
  box-shadow:0 4px 24px rgba(0,0,0,.6),0 0 20px var(--glow-p);
}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}

/* No support */
.nosup{position:fixed;inset:0;background:rgba(7,8,15,.95);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px}
.nosup.off{display:none}
.nscard{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 28px;text-align:center;max-width:300px}
.nscard h2{font-size:1.05rem;font-weight:700;margin:14px 0 10px}
.nscard p{font-size:.88rem;color:var(--text2);line-height:1.6}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

/* Glow bg decoration */
.bg-glow{position:fixed;pointer-events:none;z-index:0;border-radius:50%;filter:blur(80px);opacity:.12}
.bg-glow-1{width:300px;height:300px;background:var(--purple);top:-100px;right:-100px}
.bg-glow-2{width:250px;height:250px;background:var(--blue);bottom:100px;left:-80px}
.bg-glow-3{width:200px;height:200px;background:var(--pink);top:40%;right:60%}
</style>
</head>
<body>

<!-- Background glows -->
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="bg-glow bg-glow-3"></div>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-row">
      <div>
        <div class="greeting" id="greet">שלום! 👋</div>
        <div style="font-size:.75rem;color:var(--text2);margin-top:2px" id="dateStr"></div>
      </div>
      <div class="header-time">
        <div class="time-val" id="timeVal">--:--</div>
        <div class="date-val">עוזר חכם 🧠</div>
      </div>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card" style="--sc-color:#a78bfa;--sc-bg:#7c3aed">
      <div class="stat-emoji">📋</div>
      <div class="stat-val" id="s-task">0</div>
      <div class="stat-label">משימות</div>
    </div>
    <div class="stat-card" style="--sc-color:#fb923c;--sc-bg:#f97316">
      <div class="stat-emoji">🔔</div>
      <div class="stat-val" id="s-rem">0</div>
      <div class="stat-label">תזכורות</div>
    </div>
    <div class="stat-card" style="--sc-color:#34d399;--sc-bg:#10b981">
      <div class="stat-emoji">💡</div>
      <div class="stat-val" id="s-idea">0</div>
      <div class="stat-label">רעיונות</div>
    </div>
    <div class="stat-card" style="--sc-color:#60a5fa;--sc-bg:#3b82f6">
      <div class="stat-emoji">✅</div>
      <div class="stat-val" id="s-done">0</div>
      <div class="stat-label">הושלמו</div>
    </div>
  </div>

  <!-- Voice section -->
  <section class="voice-section">
    <div class="status-pill" id="st">לחץ על הכפתור ודבר בעברית 🎙️</div>

    <div class="wave-wrap" id="ww">
      <div class="wave" id="wv">
        <div class="wb" style="--i:1"></div><div class="wb" style="--i:2"></div><div class="wb" style="--i:3"></div>
        <div class="wb" style="--i:4"></div><div class="wb" style="--i:5"></div><div class="wb" style="--i:6"></div>
        <div class="wb" style="--i:7"></div><div class="wb" style="--i:8"></div><div class="wb" style="--i:9"></div>
        <div class="wb" style="--i:10"></div><div class="wb" style="--i:11"></div><div class="wb" style="--i:12"></div>
        <div class="wb" style="--i:13"></div><div class="wb" style="--i:14"></div><div class="wb" style="--i:15"></div>
        <div class="wb" style="--i:16"></div><div class="wb" style="--i:17"></div><div class="wb" style="--i:18"></div>
        <div class="wb" style="--i:19"></div><div class="wb" style="--i:20"></div>
      </div>
    </div>

    <div class="transcript" id="trans">
      <span class="tf" id="tf"></span><span class="ti" id="ti"></span><span class="cur" id="cur">|</span>
    </div>

    <div class="rec-area">
      <div class="rec-wrap">
        <div class="rip" id="rip"></div>
        <div class="rip2" id="rip2"></div>
        <button class="rbtn" id="rbtn" aria-label="הקלטה">
          <svg class="mic" id="mic" viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0014 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="22" x2="16" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="stp" id="stp" viewBox="0 0 24 24" fill="none" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
      </div>
      <p class="rec-label" id="rl">לחץ להקלטה</p>
    </div>

    <div class="save-area off" id="sa">
      <div>
        <p class="det-lbl">זוהה אוטומטית – שנה אם צריך:</p>
        <div class="type-btns">
          <button class="tb" data-t="task">📋 משימה</button>
          <button class="tb" data-t="reminder">🔔 תזכורת</button>
          <button class="tb" data-t="idea">💡 רעיון</button>
        </div>
      </div>
      <div class="save-actions">
        <button class="btn-save" id="svb">✨ שמור</button>
        <button class="btn-disc" id="dsb">מחק</button>
      </div>
    </div>
  </section>

  <!-- Dashboard -->
  <section class="dashboard">
    <div class="dash-header">
      <h2 class="dash-title">✦ הלוח שלי</h2>
      <button class="clr-btn" id="clrb" title="נקה הכל">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd"/></svg>
      </button>
    </div>

    <div class="ftabs" id="ftabs">
      <button class="ftab active" data-f="all">🌟 הכל</button>
      <button class="ftab" data-f="task">📋 משימות</button>
      <button class="ftab" data-f="reminder">🔔 תזכורות</button>
      <button class="ftab" data-f="idea">💡 רעיונות</button>
    </div>

    <div class="sumrow">
      <div class="chip tc" id="tcc">📋 <span>0</span></div>
      <div class="chip rc" id="rcc">🔔 <span>0</span></div>
      <div class="chip ic" id="icc">💡 <span>0</span></div>
    </div>

    <div class="cards-list" id="cl">
      <div class="empty" id="em">
        <div class="ei">🎙️</div>
        <p class="et">עוד אין פריטים</p>
        <p class="es">לחץ על הכפתור הסגול ודבר – האפליקציה תזהה ותשמור</p>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>
<div class="nosup off" id="nosup"><div class="nscard"><div style="font-size:2.5rem">🎤</div><h2>הדפדפן לא תומך בזיהוי קולי</h2><p>נא להשתמש ב-Chrome או Safari</p></div></div>

<script>
'use strict';
const P={task:{kw:['לעשות','לקנות','לשלוח','להביא','לתקן','לארגן','לנקות','לשלם','להוריד','להעלות','לפתור','לטפל','לדאוג','לבדוק','לגמור','לסיים','להכין','להגיש','לכתוב','לקרוא','לענות','לחזור','לפנות','לסדר','להזמין','לשנות','לעדכן','לרשום','לאסוף'],ph:['צריך ל','חייב ל','חייבת ל','אני צריך','אני חייב','אני חייבת','יש לי לעשות']},reminder:{kw:['תזכורת','להזכיר','לזכור','לא לשכוח','מחר','היום','בשעה','בתאריך','בשבוע','בחודש','בפגישה','בערב','בבוקר','בצהריים','בראשון','בשני','בשלישי','ברביעי','בחמישי','בשישי','בשבת'],ph:['לא לשכוח','תזכיר לי','תזכרי לי','מחר ב','היום ב','בשעה ']},idea:{kw:['רעיון','אפשר','אולי','מה אם','למה לא','חשבתי','יכול להיות','אפשרות','הצעה','תוכנית','להמציא','לפתח','ליצור','לבנות','לנסות','לחקור','מעניין','כדאי','שווה'],ph:['מה אם','למה לא','חשבתי על','יש לי רעיון','אולי אפשר']}};

const s={rec:false,final:'',interim:'',type:null,items:[],filter:'all',recog:null,tt:null};
const $=id=>document.getElementById(id);
const e={st:$('st'),ww:$('ww'),wv:$('wv'),tf:$('tf'),ti:$('ti'),cur:$('cur'),rbtn:$('rbtn'),rip:$('rip'),rip2:$('rip2'),rl:$('rl'),mic:$('mic'),stp:$('stp'),sa:$('sa'),svb:$('svb'),dsb:$('dsb'),cl:$('cl'),em:$('em'),ftabs:$('ftabs'),tcc:$('tcc'),rcc:$('rcc'),icc:$('icc'),toast:$('toast'),clrb:$('clrb'),nosup:$('nosup')};

// Clock
function tick(){const now=new Date(),h=String(now.getHours()).padStart(2,'0'),m=String(now.getMinutes()).padStart(2,'0');$('timeVal').textContent=`${h}:${m}`;const hr=now.getHours();let g=hr<5?'לילה טוב 🌙':hr<12?'בוקר טוב ☀️':hr<17?'צהריים טובים 🌤️':hr<21?'ערב טוב 🌆':'לילה טוב 🌙';$('greet').textContent=g;$('dateStr').textContent=now.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})}
tick();setInterval(tick,30000);

function detect(t){const l=t.toLowerCase(),sc={task:0,reminder:0,idea:0};for(const[tp,c]of Object.entries(P)){for(const k of c.kw)if(l.includes(k))sc[tp]++;for(const p of c.ph)if(l.includes(p))sc[tp]+=2}const b=Object.entries(sc).reduce((a,x)=>x[1]>a[1]?x:a);return b[1]>0?b[0]:'idea'}

function initRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){e.nosup.classList.remove('off');return null}const r=new SR();r.lang='he-IL';r.continuous=true;r.interimResults=true;
r.onstart=()=>{s.rec=true;setUI(true)};
r.onresult=ev=>{let im='',fn=s.final;for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript;ev.results[i].isFinal?fn+=(fn?' ':'')+t:im=t}s.final=fn;s.interim=im;upT()};
r.onerror=ev=>{if(ev.error==='no-speech'||ev.error==='aborted')return;stop();toast('שגיאה: '+ev.error)};
r.onend=()=>{if(s.rec)try{r.start()}catch(_){stop()}};
return r}

function start(){s.final='';s.interim='';upT();e.sa.classList.add('off');if(!s.recog){s.recog=initRec();if(!s.recog)return}try{s.recog.start()}catch(_){}}
function stop(){s.rec=false;setUI(false);if(s.recog)try{s.recog.stop()}catch(_){}const t=(s.final+' '+s.interim).trim();s.final=t;s.interim='';upT();if(t.length>1)showSave(t)}
function toggle(){s.rec?stop():start()}

function setUI(a){e.rbtn.classList.toggle('live',a);e.rip.classList.toggle('on',a);e.rip2.classList.toggle('on',a);e.ww.classList.toggle('on',a);e.wv.classList.toggle('go',a);e.cur.classList.toggle('on',a);e.mic.style.display=a?'none':'block';e.stp.style.display=a?'block':'none';e.rl.textContent=a?'מקשיב...':'לחץ להקלטה';e.st.textContent=a?'🔴 מקשיב... דבר עכשיו':'לחץ על הכפתור ודבר בעברית 🎙️';e.st.className='status-pill'+(a?' rec':'')}
function upT(){e.tf.textContent=s.final;e.ti.textContent=s.interim?(s.final?' ':'')+s.interim:''}
function showSave(t){const d=detect(t);s.type=d;document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('sel',b.dataset.t===d));e.sa.classList.remove('off');e.st.textContent='✅ זוהה! בחר סוג ושמור';e.st.className='status-pill ok'}

document.querySelectorAll('.tb').forEach(b=>b.addEventListener('click',()=>{s.type=b.dataset.t;document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('sel',x===b))}));

e.svb.addEventListener('click',()=>{const t=s.final.trim();if(!t)return;const item={id:Date.now(),text:t,type:s.type||'idea',done:false,at:new Date().toISOString()};s.items.unshift(item);save();render();sum();s.final='';s.interim='';s.type=null;upT();e.sa.classList.add('off');e.st.textContent='לחץ על הכפתור ודבר בעברית 🎙️';e.st.className='status-pill';toast({task:'משימה נשמרה 📋',reminder:'תזכורת נשמרה 🔔',idea:'רעיון נשמר 💡'}[item.type])});

e.dsb.addEventListener('click',()=>{s.final='';s.interim='';s.type=null;upT();e.sa.classList.add('off');e.st.textContent='לחץ על הכפתור ודבר בעברית 🎙️';e.st.className='status-pill'});
e.rbtn.addEventListener('click',toggle);
e.ftabs.addEventListener('click',ev=>{const t=ev.target.closest('.ftab');if(!t)return;s.filter=t.dataset.f;document.querySelectorAll('.ftab').forEach(x=>x.classList.toggle('active',x===t));render()});
e.clrb.addEventListener('click',()=>{if(!s.items.length)return;if(!confirm('למחוק את כל הפריטים?'))return;s.items=[];save();render();sum();toast('הלוח נוקה 🗑️')});

function render(){const f=s.filter==='all'?s.items:s.items.filter(i=>i.type===s.filter);e.cl.querySelectorAll('.card').forEach(c=>c.remove());if(!f.length){e.em.style.display='';return}e.em.style.display='none';f.forEach(i=>e.cl.appendChild(mk(i)))}

function mk(i){const d=document.createElement('div');d.className=`card ${i.type}-card${i.done?' done':''}`;const lb={task:'משימה',reminder:'תזכורת',idea:'רעיון'};const em={task:'📋',reminder:'🔔',idea:'💡'};d.innerHTML=`<button class="cchk">${i.done?'✓':''}</button><div class="cbody"><p class="ct">${esc(i.text)}</p><div class="cmeta"><span class="cbadge ${i.type}-badge">${em[i.type]} ${lb[i.type]}</span><span class="ctime">${ft(i.at)}</span></div></div><button class="cdel"><svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg></button>`;d.querySelector('.cchk').addEventListener('click',()=>{i.done=!i.done;save();render();sum()});d.querySelector('.cdel').addEventListener('click',()=>{s.items=s.items.filter(x=>x.id!==i.id);save();render();sum();toast('נמחק')});return d}

function sum(){const tot=s.items.length,tk=s.items.filter(i=>i.type==='task').length,rm=s.items.filter(i=>i.type==='reminder').length,id=s.items.filter(i=>i.type==='idea').length,dn=s.items.filter(i=>i.done).length;$('s-task').textContent=tk;$('s-rem').textContent=rm;$('s-idea').textContent=id;$('s-done').textContent=dn;e.tcc.innerHTML=`📋 <span>${tk}</span>`;e.rcc.innerHTML=`🔔 <span>${rm}</span>`;e.icc.innerHTML=`💡 <span>${id}</span>`}

function toast(m){clearTimeout(s.tt);e.toast.textContent=m;e.toast.classList.add('show');s.tt=setTimeout(()=>e.toast.classList.remove('show'),2500)}
function save(){try{localStorage.setItem('hba2',JSON.stringify(s.items))}catch(_){}}
function load(){try{const d=localStorage.getItem('hba2');if(d)s.items=JSON.parse(d)}catch(_){s.items=[]}}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ft(iso){const d=new Date(iso),n=new Date(),df=n-d;if(df<60000)return'עכשיו';if(df<3600000)return`לפני ${Math.floor(df/60000)} דק'`;if(df<86400000)return`לפני ${Math.floor(df/3600000)} שע'`;return d.toLocaleDateString('he-IL',{day:'numeric',month:'short'})}

load();render();sum();
if(!window.SpeechRecognition&&!window.webkitSpeechRecognition)e.nosup.classList.remove('off');
</script>
</body>
</html>
