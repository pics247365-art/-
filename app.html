<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="עוזר חכם">
<title>עוזר חכם 🧠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1117;--surface:#161b27;--surface-2:#1e2437;--border:rgba(255,255,255,0.07);--border-h:rgba(255,255,255,0.14);--text:#eef2ff;--text-2:#9aafc8;--text-m:#5c6b84;--task:#3b82f6;--task-bg:rgba(59,130,246,0.12);--rem:#f59e0b;--rem-bg:rgba(245,158,11,0.12);--idea:#10b981;--idea-bg:rgba(16,185,129,0.12);--grad:linear-gradient(135deg,#7c3aed,#3b82f6);--red:linear-gradient(135deg,#ef4444,#dc2626);--r:18px;--rs:10px;--rx:6px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-family:'Heebo',system-ui,sans-serif;font-size:16px;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;direction:rtl;scroll-behavior:smooth}
body{min-height:100dvh;background:var(--bg);overflow-x:hidden}
button{cursor:pointer;font-family:inherit}
.app{max-width:520px;margin:0 auto;padding-bottom:calc(24px + var(--sb));min-height:100dvh;display:flex;flex-direction:column}

/* Header */
.app-header{position:sticky;top:0;z-index:100;padding-top:var(--st);background:rgba(14,17,23,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;flex-shrink:0}
.logo-icon svg{width:100%;height:100%}
.logo-text{font-size:1.25rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-pill{font-size:.75rem;font-weight:600;color:var(--text-2);background:var(--surface-2);padding:4px 12px;border-radius:999px;border:1px solid var(--border)}

/* Voice */
.voice-section{padding:24px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:20px}
.status-area{text-align:center}
.status-text{font-size:.9rem;color:var(--text-2);font-weight:400;transition:color .3s}
.status-text.rec{color:#f87171}
.status-text.ok{color:var(--idea)}

/* Waveform */
.waveform-wrap{width:100%;height:56px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scaleY(.5);transition:opacity .4s,transform .4s}
.waveform-wrap.active{opacity:1;transform:scaleY(1)}
.waveform{display:flex;align-items:center;gap:3px;height:100%}
.wb{width:3px;border-radius:3px;background:linear-gradient(to top,#7c3aed,#3b82f6);height:8px}
.waveform.go .wb{animation:wave calc(.6s + var(--i)*.04s) ease-in-out infinite alternate;animation-delay:calc(var(--i)*.03s)}
@keyframes wave{0%,100%{height:8px}50%{height:calc(8px + var(--i)*2px + 10px)}}

/* Transcript */
.transcript-wrap{width:100%;min-height:72px;display:flex;align-items:center;justify-content:center}
.transcript-box{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;font-size:1rem;line-height:1.65;min-height:72px;word-break:break-word}
.tf{color:var(--text);font-weight:500}
.ti{color:var(--text-m);font-style:italic}
.cur{color:var(--task);font-weight:300;animation:blink 1s step-end infinite;opacity:0}
.cur.on{opacity:1}
@keyframes blink{50%{opacity:0}0%,100%{opacity:1}}

/* Record btn */
.record-area{display:flex;flex-direction:column;align-items:center;gap:12px}
.rbw{position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center}
.ripple{position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(124,58,237,.4);opacity:0;transform:scale(.8)}
.ripple.on{animation:rip 1.4s ease-out infinite}
@keyframes rip{0%{opacity:.8;transform:scale(.85)}100%{opacity:0;transform:scale(1.35)}}
.record-btn{width:80px;height:80px;border-radius:50%;border:none;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(124,58,237,.4);transition:transform .15s,box-shadow .2s;position:relative;z-index:1}
.record-btn:active{transform:scale(.93)}
.record-btn.live{background:var(--red);box-shadow:0 8px 32px rgba(239,68,68,.45);animation:pbtn 1.6s ease-in-out infinite}
@keyframes pbtn{0%,100%{box-shadow:0 8px 32px rgba(239,68,68,.45)}50%{box-shadow:0 8px 40px rgba(239,68,68,.7)}}
.mic,.stp{width:28px;height:28px}
.rl{font-size:.82rem;font-weight:500;color:var(--text-2);letter-spacing:.02em}

/* Save area */
.save-area{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;animation:sup .3s ease}
.save-area.off{display:none}
@keyframes sup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.det-label{font-size:.78rem;font-weight:600;color:var(--text-m);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.type-badges{display:flex;gap:8px;flex-wrap:wrap}
.tb{padding:7px 14px;border-radius:var(--rx);border:1.5px solid var(--border);background:transparent;color:var(--text-2);font-size:.85rem;font-weight:500;transition:all .15s}
.tb.sel[data-t="task"]{background:var(--task-bg);border-color:var(--task);color:var(--task)}
.tb.sel[data-t="reminder"]{background:var(--rem-bg);border-color:var(--rem);color:var(--rem)}
.tb.sel[data-t="idea"]{background:var(--idea-bg);border-color:var(--idea);color:var(--idea)}
.save-actions{display:flex;gap:10px}
.btn-save{flex:1;padding:12px;border-radius:var(--rs);border:none;background:var(--grad);color:#fff;font-size:.95rem;font-weight:600;transition:opacity .15s,transform .1s}
.btn-save:active{transform:scale(.97);opacity:.9}
.btn-disc{padding:12px 20px;border-radius:var(--rs);border:1px solid var(--border);background:transparent;color:var(--text-2);font-size:.9rem;font-weight:500;transition:background .15s}
.btn-disc:hover{background:rgba(255,255,255,.05)}

/* Dashboard */
.dashboard{flex:1;padding:0 20px 8px;display:flex;flex-direction:column;gap:16px}
.dash-header{display:flex;align-items:center;justify-content:space-between}
.dash-title{font-size:1.1rem;font-weight:700}
.clr-btn{background:transparent;border:1px solid var(--border);color:var(--text-m);border-radius:var(--rx);padding:6px 8px;display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s}
.clr-btn:hover{color:#f87171;border-color:rgba(248,113,113,.4)}

/* Filter tabs */
.ftabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ftabs::-webkit-scrollbar{display:none}
.ftab{padding:7px 14px;border-radius:999px;border:1.5px solid var(--border);background:transparent;color:var(--text-2);font-size:.82rem;font-weight:500;white-space:nowrap;transition:all .15s;flex-shrink:0}
.ftab.active{background:var(--surface-2);border-color:rgba(124,58,237,.5);color:var(--text)}

/* Summary */
.sumrow{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:var(--rx);font-size:.8rem;font-weight:600}
.tc{background:var(--task-bg);color:var(--task)}
.rc{background:var(--rem-bg);color:var(--rem)}
.ic{background:var(--idea-bg);color:var(--idea)}

/* Cards */
.cards-list{display:flex;flex-direction:column;gap:10px;flex:1}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:48px 20px;text-align:center}
.ei{font-size:2.5rem;opacity:.5}
.et{font-size:1rem;font-weight:600;color:var(--text-2)}
.es{font-size:.83rem;color:var(--text-m);line-height:1.5}
.card{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--border);border-right:3px solid;border-radius:var(--rs);padding:14px 16px;animation:cin .25s ease;transition:opacity .2s}
@keyframes cin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
.card.task-card{border-right-color:var(--task)}
.card.reminder-card{border-right-color:var(--rem)}
.card.idea-card{border-right-color:var(--idea)}
.card.done{opacity:.5}
.card.done .ct{text-decoration:line-through;color:var(--text-m)}
.cchk{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .15s;color:transparent;font-size:11px}
.card.done .cchk{border-color:var(--text-m);background:rgba(255,255,255,.06);color:var(--text-m)}
.cbody{flex:1;min-width:0}
.ct{font-size:.95rem;font-weight:400;color:var(--text);line-height:1.55;word-break:break-word}
.cmeta{display:flex;align-items:center;gap:8px;margin-top:6px}
.cbadge{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px}
.task-badge{background:var(--task-bg);color:var(--task)}
.reminder-badge{background:var(--rem-bg);color:var(--rem)}
.idea-badge{background:var(--idea-bg);color:var(--idea)}
.ctime{font-size:.72rem;color:var(--text-m)}
.cdel{flex-shrink:0;background:transparent;border:none;color:var(--text-m);padding:4px;border-radius:6px;display:flex;align-items:center;transition:color .15s;opacity:0}
.card:hover .cdel{opacity:1}
.cdel:hover{color:#f87171}
@media(hover:none){.cdel{opacity:1}}

/* Toast */
.toast{position:fixed;bottom:calc(24px + var(--sb));right:50%;transform:translateX(50%) translateY(20px);background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:10px 20px;border-radius:999px;font-size:.88rem;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:200;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}

/* No support */
.nosup{position:fixed;inset:0;background:rgba(14,17,23,.95);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px}
.nosup.off{display:none}
.nscard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:36px 28px;text-align:center;max-width:320px}
.nscard h2{font-size:1.1rem;font-weight:700;margin:16px 0 12px;color:var(--text)}
.nscard p{font-size:.9rem;color:var(--text-2);line-height:1.6}
:focus-visible{outline:2px solid rgba(124,58,237,.6);outline-offset:2px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="14" fill="url(#g)"/><circle cx="14" cy="15" r="2.5" fill="#fff"/><circle cx="22" cy="15" r="2.5" fill="#fff"/><path d="M12 22q6 6 12 0" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/><defs><linearGradient id="g" x1="4" y1="4" x2="32" y2="32"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs></svg>
        </div>
        <span class="logo-text">עוזר חכם</span>
      </div>
      <span class="stat-pill" id="stp">0 פריטים</span>
    </div>
  </header>

  <section class="voice-section">
    <div class="status-area"><p class="status-text" id="st">לחץ על הכפתור ודבר בעברית</p></div>

    <div class="waveform-wrap" id="ww">
      <div class="waveform" id="wv">
        <div class="wb" style="--i:1"></div><div class="wb" style="--i:2"></div><div class="wb" style="--i:3"></div>
        <div class="wb" style="--i:4"></div><div class="wb" style="--i:5"></div><div class="wb" style="--i:6"></div>
        <div class="wb" style="--i:7"></div><div class="wb" style="--i:8"></div><div class="wb" style="--i:9"></div>
        <div class="wb" style="--i:10"></div><div class="wb" style="--i:11"></div><div class="wb" style="--i:12"></div>
        <div class="wb" style="--i:13"></div><div class="wb" style="--i:14"></div><div class="wb" style="--i:15"></div>
        <div class="wb" style="--i:16"></div><div class="wb" style="--i:17"></div><div class="wb" style="--i:18"></div>
        <div class="wb" style="--i:19"></div><div class="wb" style="--i:20"></div>
      </div>
    </div>

    <div class="transcript-wrap">
      <div class="transcript-box">
        <span class="tf" id="tf"></span><span class="ti" id="ti"></span><span class="cur" id="cur">|</span>
      </div>
    </div>

    <div class="record-area">
      <div class="rbw">
        <div class="ripple" id="rip"></div>
        <button class="record-btn" id="rbtn" aria-label="התחל הקלטה">
          <svg class="mic" id="mic" viewBox="0 0 24 24" fill="none"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0014 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="18" x2="12" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="22" x2="16" y2="22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="stp" id="stp2" viewBox="0 0 24 24" fill="none" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
      </div>
      <p class="rl" id="rl">לחץ להקלטה</p>
    </div>

    <div class="save-area off" id="sa">
      <div>
        <p class="det-label">זוהה כ:</p>
        <div class="type-badges">
          <button class="tb" data-t="task">📋 משימה</button>
          <button class="tb" data-t="reminder">🔔 תזכורת</button>
          <button class="tb" data-t="idea">💡 רעיון</button>
        </div>
      </div>
      <div class="save-actions">
        <button class="btn-save" id="svb">שמור</button>
        <button class="btn-disc" id="dsb">מחק</button>
      </div>
    </div>
  </section>

  <section class="dashboard">
    <div class="dash-header">
      <h2 class="dash-title">הלוח שלי</h2>
      <button class="clr-btn" id="clrb" title="נקה הכל">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4 0a1 1 0 012 0v6a1 1 0 11-2 0V8z" clip-rule="evenodd"/></svg>
      </button>
    </div>

    <div class="ftabs" id="ftabs">
      <button class="ftab active" data-f="all">הכל</button>
      <button class="ftab" data-f="task">📋 משימות</button>
      <button class="ftab" data-f="reminder">🔔 תזכורות</button>
      <button class="ftab" data-f="idea">💡 רעיונות</button>
    </div>

    <div class="sumrow">
      <div class="chip tc" id="tcc">📋 <span>0</span></div>
      <div class="chip rc" id="rcc">🔔 <span>0</span></div>
      <div class="chip ic" id="icc">💡 <span>0</span></div>
    </div>

    <div class="cards-list" id="cl">
      <div class="empty" id="em">
        <div class="ei">🎤</div>
        <p class="et">עוד אין פריטים</p>
        <p class="es">הקלט כדי להוסיף משימות, תזכורות ורעיונות</p>
      </div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<div class="nosup off" id="nosup">
  <div class="nscard">
    <div style="font-size:2.5rem">🎤</div>
    <h2>הדפדפן לא תומך בזיהוי קולי</h2>
    <p>נא להשתמש ב-Chrome או Safari כדי להשתמש בתכונת ההקלטה</p>
  </div>
</div>

<script>
'use strict';
const P={task:{kw:['לעשות','לקנות','לשלוח','להביא','לתקן','לארגן','לנקות','לשלם','להוריד','להעלות','לפתור','לטפל','לדאוג','לבדוק','לגמור','לסיים','להכין','להגיש','לכתוב','לקרוא','לענות','לחזור','לפנות','לסדר','להזמין','לשנות','לעדכן','לרשום','לאסוף'],ph:['צריך ל','חייב ל','חייבת ל','אני צריך','אני חייב','אני חייבת','יש לי לעשות']},reminder:{kw:['תזכורת','להזכיר','לזכור','לא לשכוח','מחר','היום','בשעה','בתאריך','בשבוע','בחודש','בפגישה','בערב','בבוקר','בצהריים','בראשון','בשני','בשלישי','ברביעי','בחמישי','בשישי','בשבת'],ph:['לא לשכוח','תזכיר לי','תזכרי לי','מחר ב','היום ב','בשעה ']},idea:{kw:['רעיון','אפשר','אולי','מה אם','למה לא','חשבתי','יכול להיות','אפשרות','הצעה','תוכנית','להמציא','לפתח','ליצור','לבנות','לנסות','לחקור','מעניין','כדאי','שווה'],ph:['מה אם','למה לא','חשבתי על','יש לי רעיון','אולי אפשר']}};

const s={rec:false,final:'',interim:'',type:null,items:[],filter:'all',recog:null,tt:null};

function detect(t){const l=t.toLowerCase(),sc={task:0,reminder:0,idea:0};for(const[tp,c]of Object.entries(P)){for(const k of c.kw)if(l.includes(k))sc[tp]++;for(const p of c.ph)if(l.includes(p))sc[tp]+=2}const b=Object.entries(sc).reduce((a,x)=>x[1]>a[1]?x:a);return b[1]>0?b[0]:'idea'}

const $=id=>document.getElementById(id);
const e={st:$('st'),ww:$('ww'),wv:$('wv'),tf:$('tf'),ti:$('ti'),cur:$('cur'),rbtn:$('rbtn'),rip:$('rip'),rl:$('rl'),mic:$('mic'),stp:$('stp2'),sa:$('sa'),svb:$('svb'),dsb:$('dsb'),cl:$('cl'),em:$('em'),ftabs:$('ftabs'),stp2:$('stp'),tcc:$('tcc'),rcc:$('rcc'),icc:$('icc'),toast:$('toast'),clrb:$('clrb'),nosup:$('nosup')};

function initRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){e.nosup.classList.remove('off');return null}const r=new SR();r.lang='he-IL';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
r.onstart=()=>{s.rec=true;setUI(true)};
r.onresult=ev=>{let im='',fn=s.final;for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript;ev.results[i].isFinal?fn+=(fn?' ':'')+t:im=t}s.final=fn;s.interim=im;upTrans()};
r.onerror=ev=>{if(ev.error==='no-speech'||ev.error==='aborted')return;stop();toast('שגיאה: '+ev.error)};
r.onend=()=>{if(s.rec)try{r.start()}catch(_){stop()}};
return r}

function start(){s.final='';s.interim='';upTrans();e.sa.classList.add('off');if(!s.recog){s.recog=initRec();if(!s.recog)return}try{s.recog.start()}catch(_){}}
function stop(){s.rec=false;setUI(false);if(s.recog)try{s.recog.stop()}catch(_){}const t=(s.final+' '+s.interim).trim();s.final=t;s.interim='';upTrans();if(t.length>1)showSave(t)}
function toggle(){s.rec?stop():start()}

function setUI(a){e.rbtn.classList.toggle('live',a);e.rip.classList.toggle('on',a);e.ww.classList.toggle('active',a);e.wv.classList.toggle('go',a);e.cur.classList.toggle('on',a);e.mic.style.display=a?'none':'block';e.stp.style.display=a?'block':'none';e.rl.textContent=a?'מקשיב...':'לחץ להקלטה';e.st.textContent=a?'🎙️ מקשיב...':'לחץ על הכפתור ודבר בעברית';e.st.className='status-text'+(a?' rec':'')}
function upTrans(){e.tf.textContent=s.final;e.ti.textContent=s.interim?(s.final?' ':'')+s.interim:''}
function showSave(t){const d=detect(t);s.type=d;document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('sel',b.dataset.t===d));e.sa.classList.remove('off');e.st.textContent='בחר סוג ושמור';e.st.className='status-text ok'}

document.querySelectorAll('.tb').forEach(b=>b.addEventListener('click',()=>{s.type=b.dataset.t;document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('sel',x===b))}));

e.svb.addEventListener('click',()=>{const t=s.final.trim();if(!t)return;const item={id:Date.now(),text:t,type:s.type||'idea',done:false,at:new Date().toISOString()};s.items.unshift(item);save();render();sum();s.final='';s.interim='';s.type=null;upTrans();e.sa.classList.add('off');e.st.textContent='לחץ על הכפתור ודבר בעברית';e.st.className='status-text';toast({task:'משימה נשמרה 📋',reminder:'תזכורת נשמרה 🔔',idea:'רעיון נשמר 💡'}[item.type])});

e.dsb.addEventListener('click',()=>{s.final='';s.interim='';s.type=null;upTrans();e.sa.classList.add('off');e.st.textContent='לחץ על הכפתור ודבר בעברית';e.st.className='status-text'});

e.rbtn.addEventListener('click',toggle);

e.ftabs.addEventListener('click',ev=>{const t=ev.target.closest('.ftab');if(!t)return;s.filter=t.dataset.f;document.querySelectorAll('.ftab').forEach(x=>x.classList.toggle('active',x===t));render()});

e.clrb.addEventListener('click',()=>{if(!s.items.length)return;if(!confirm('למחוק את כל הפריטים?'))return;s.items=[];save();render();sum();toast('הלוח נוקה')});

function render(){const f=s.filter==='all'?s.items:s.items.filter(i=>i.type===s.filter);e.cl.querySelectorAll('.card').forEach(c=>c.remove());if(!f.length){e.em.style.display='';return}e.em.style.display='none';f.forEach(i=>e.cl.appendChild(mkCard(i)))}

function mkCard(i){const d=document.createElement('div');d.className=`card ${i.type}-card${i.done?' done':''}`;d.dataset.id=i.id;const lb={task:'משימה',reminder:'תזכורת',idea:'רעיון'};const em={task:'📋',reminder:'🔔',idea:'💡'};d.innerHTML=`<button class="cchk">${i.done?'✓':''}</button><div class="cbody"><p class="ct">${esc(i.text)}</p><div class="cmeta"><span class="cbadge ${i.type}-badge">${em[i.type]} ${lb[i.type]}</span><span class="ctime">${ft(i.at)}</span></div></div><button class="cdel"><svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg></button>`;d.querySelector('.cchk').addEventListener('click',()=>{i.done=!i.done;save();render();sum()});d.querySelector('.cdel').addEventListener('click',()=>{s.items=s.items.filter(x=>x.id!==i.id);save();render();sum();toast('פריט נמחק')});return d}

function sum(){const tot=s.items.length;e.stp2.textContent=`${tot} פריטים`;e.tcc.innerHTML=`📋 <span>${s.items.filter(i=>i.type==='task').length}</span>`;e.rcc.innerHTML=`🔔 <span>${s.items.filter(i=>i.type==='reminder').length}</span>`;e.icc.innerHTML=`💡 <span>${s.items.filter(i=>i.type==='idea').length}</span>`}

function toast(m){clearTimeout(s.tt);e.toast.textContent=m;e.toast.classList.add('show');s.tt=setTimeout(()=>e.toast.classList.remove('show'),2400)}

function save(){try{localStorage.setItem('hba',JSON.stringify(s.items))}catch(_){}}
function load(){try{const d=localStorage.getItem('hba');if(d)s.items=JSON.parse(d)}catch(_){s.items=[]}}
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ft(iso){const d=new Date(iso),n=new Date(),df=n-d;if(df<60000)return'עכשיו';if(df<3600000)return`לפני ${Math.floor(df/60000)} דקות`;if(df<86400000)return`לפני ${Math.floor(df/3600000)} שעות`;return d.toLocaleDateString('he-IL',{day:'numeric',month:'short'})}

load();render();sum();
if(!window.SpeechRecognition&&!window.webkitSpeechRecognition)e.nosup.classList.remove('off');
</script>
</body>
</html>
