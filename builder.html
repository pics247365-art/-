<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בונה דפי נחיתה AI — אילן לוי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;700;900&family=Assistant:wght@300;400;600;700&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --cream: #e8e0d0;
  --gold: #c49a2a;
  --warm: #c8a97a;
  --card: #111;
  --border: #1e1e1e;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--cream);
  font-family: 'Assistant', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* NAV */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.5rem;
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.nav-logo {
  font-family: 'Frank Ruhl Libre', serif;
  font-weight: 900;
  font-size: 1.05rem;
  color: var(--cream);
  text-decoration: none;
}

.nav-badge {
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  color: var(--gold);
  text-transform: uppercase;
  border: 1px solid var(--gold);
  padding: 3px 10px;
  border-radius: 20px;
  opacity: 0.85;
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 1.5rem 3rem;
  text-align: center;
  position: relative;
}

.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 50% at 50% 40%, rgba(196,154,42,0.07) 0%, transparent 70%);
  pointer-events: none;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.72rem;
  letter-spacing: 0.15em;
  color: var(--warm);
  text-transform: uppercase;
  border: 1px solid rgba(196,154,42,0.3);
  padding: 5px 14px;
  border-radius: 20px;
  margin-bottom: 2rem;
}

.badge svg { width: 14px; height: 14px; opacity: 0.8; }

h1 {
  font-family: 'Frank Ruhl Libre', serif;
  font-weight: 900;
  font-size: clamp(2rem, 7vw, 3.8rem);
  line-height: 1.15;
  margin-bottom: 1rem;
  color: var(--cream);
}

.subtitle {
  font-size: clamp(0.95rem, 2.5vw, 1.15rem);
  color: #888;
  margin-bottom: 2.5rem;
  font-weight: 300;
}

/* INPUT AREA */
.input-wrap {
  width: 100%;
  max-width: 640px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 8px 8px 14px;
  margin-bottom: 1.2rem;
  transition: border-color 0.2s;
}

.input-wrap:focus-within {
  border-color: rgba(196,154,42,0.5);
}

.input-wrap input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--cream);
  font-family: 'Assistant', sans-serif;
  font-size: 1rem;
  direction: rtl;
  text-align: right;
}

.input-wrap input::placeholder { color: #444; }

.btn-send {
  width: 40px;
  height: 40px;
  background: var(--gold);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s, transform 0.1s;
}

.btn-send:hover { background: #d4aa30; }
.btn-send:active { transform: scale(0.95); }
.btn-send svg { width: 18px; height: 18px; color: #000; }

/* PILLS */
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 640px;
  width: 100%;
}

.pill {
  padding: 8px 18px;
  border: 1px solid var(--border);
  border-radius: 50px;
  font-size: 0.88rem;
  color: #888;
  cursor: pointer;
  background: none;
  font-family: 'Assistant', sans-serif;
  transition: all 0.18s;
  white-space: nowrap;
}

.pill:hover {
  border-color: var(--gold);
  color: var(--warm);
  background: rgba(196,154,42,0.06);
}

/* LOADING */
#loading {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
  padding: 3rem;
  color: #666;
}

.spinner {
  width: 36px;
  height: 36px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* RESULT */
#result-section {
  display: none;
  width: 100%;
  padding: 0 1rem 4rem;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}

.result-toolbar {
  display: flex;
  gap: 10px;
  width: 100%;
  max-width: 900px;
  flex-wrap: wrap;
}

.btn-action {
  padding: 10px 20px;
  border-radius: 8px;
  font-family: 'Assistant', sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: all 0.18s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--gold);
  color: #000;
  border-color: var(--gold);
  font-weight: 700;
}

.btn-primary:hover { background: #d4aa30; }

.btn-ghost {
  background: none;
  color: var(--cream);
}

.btn-ghost:hover {
  border-color: #555;
  background: #111;
}

.btn-new {
  background: none;
  color: #888;
  margin-right: auto;
}

.btn-new:hover { color: var(--cream); border-color: #555; }

iframe#preview {
  width: 100%;
  max-width: 900px;
  height: 80vh;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
}

/* ERROR */
#error-msg {
  display: none;
  color: #e55;
  font-size: 0.9rem;
  margin-top: 0.5rem;
}

@media (max-width: 480px) {
  .pills { gap: 6px; }
  .pill { font-size: 0.82rem; padding: 7px 14px; }
  iframe#preview { height: 70vh; }
}
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">אילן לוי</a>
  <span class="nav-badge">AI Builder</span>
</nav>

<!-- HERO -->
<section class="hero" id="hero-section">
  <div class="badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </svg>
    AI Landing Page Builder
  </div>

  <h1>מה תרצו להוציא היום לאור?</h1>
  <p class="subtitle">תארו את השירות שלכם — אצור דף נחיתה מוכן תוך שניות</p>

  <div class="input-wrap">
    <input
      type="text"
      id="desc-input"
      placeholder="עמוד לקורס צילום, סדנת יוגה, שירותי עיצוב..."
      maxlength="200"
      autocomplete="off"
    >
    <button class="btn-send" onclick="generate()" title="צור דף">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>

  <div id="error-msg"></div>

  <div class="pills">
    <button class="pill" onclick="usePill(this)">ליווי אישי</button>
    <button class="pill" onclick="usePill(this)">קורס אונליין</button>
    <button class="pill" onclick="usePill(this)">סדנה פרונטלית</button>
    <button class="pill" onclick="usePill(this)">שירות חדש</button>
    <button class="pill" onclick="usePill(this)">אימון כושר</button>
    <button class="pill" onclick="usePill(this)">ייעוץ עסקי</button>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <span>בונה את הדף שלך...</span>
  </div>
</section>

<!-- RESULT -->
<section id="result-section">
  <div class="result-toolbar">
    <button class="btn-action btn-primary" onclick="downloadHTML()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      הורד HTML
    </button>
    <button class="btn-action btn-ghost" onclick="copyHTML()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      העתק קוד
    </button>
    <button class="btn-action btn-new" onclick="reset()">← דף חדש</button>
  </div>
  <iframe id="preview" title="תצוגה מקדימה"></iframe>
</section>

<script>
let generatedHTML = '';

function usePill(el) {
  document.getElementById('desc-input').value = el.textContent;
  generate();
}

async function generate() {
  const input = document.getElementById('desc-input');
  const desc = input.value.trim();
  const errEl = document.getElementById('error-msg');

  errEl.style.display = 'none';

  if (desc.length < 3) {
    errEl.textContent = 'נא לתאר את השירות בכמה מילים';
    errEl.style.display = 'block';
    return;
  }

  document.getElementById('loading').style.display = 'flex';
  document.querySelector('.input-wrap').style.opacity = '0.5';
  document.querySelector('.pills').style.opacity = '0.3';

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: desc })
    });

    const data = await res.json();

    if (!res.ok || data.error) {
      throw new Error(data.error || 'שגיאה לא ידועה');
    }

    generatedHTML = data.html;
    showResult();

  } catch (err) {
    errEl.textContent = 'שגיאה: ' + err.message;
    errEl.style.display = 'block';
  } finally {
    document.getElementById('loading').style.display = 'none';
    document.querySelector('.input-wrap').style.opacity = '1';
    document.querySelector('.pills').style.opacity = '1';
  }
}

function showResult() {
  document.getElementById('hero-section').style.display = 'none';
  const resultSection = document.getElementById('result-section');
  resultSection.style.display = 'flex';
  resultSection.scrollIntoView({ behavior: 'smooth' });

  const iframe = document.getElementById('preview');
  iframe.srcdoc = generatedHTML;
}

function reset() {
  document.getElementById('hero-section').style.display = 'flex';
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('desc-input').value = '';
  generatedHTML = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function downloadHTML() {
  const blob = new Blob([generatedHTML], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'landing-page.html';
  a.click();
}

function copyHTML() {
  navigator.clipboard.writeText(generatedHTML).then(() => {
    const btn = document.querySelector('.btn-ghost');
    const orig = btn.innerHTML;
    btn.textContent = '✓ הועתק';
    setTimeout(() => { btn.innerHTML = orig; }, 2000);
  });
}

document.getElementById('desc-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') generate();
});
</script>

</body>
</html>
